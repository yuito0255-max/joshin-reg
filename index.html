<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Joshin POSレジ (全12,000商品)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }
    header {
      height: 44px;
      background: #d7000f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
    }
    .logo { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; }
    .badge { background: #fff; color: #d7000f; font-size: 10px; padding: 1px 6px; border-radius: 99px; font-weight: 700; }
    .header-btns { display: flex; gap: 6px; }
    .h-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 8px;
      padding: 8px;
      min-height: 0;
    }
    @media (max-width: 720px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 1.1fr 1fr; }
    }
    .panel {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 8px;
    }
    .search-row { display: flex; gap: 6px; margin-bottom: 6px; flex-shrink: 0; }
    .search-row input {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 4px;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      white-space: nowrap;
      padding: 4px 8px;
      border-radius: 99px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      color: #334155;
    }
    .tab-btn.active { background: #d7000f; color: #fff; border-color: #d7000f; }
    .maker-btn.active { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    .grid-wrap {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 6px;
      align-content: start;
      padding-right: 2px;
    }
    .p-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px;
      background: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 68px;
    }
    .p-card:active { background: #fee2e2; border-color: #d7000f; }
    .p-maker { font-size: 9px; color: #64748b; font-weight: 700; }
    .p-name { font-size: 11px; font-weight: 600; line-height: 1.25; margin: 2px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .p-price { font-size: 12px; font-weight: 800; color: #d7000f; text-align: right; }
    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid #e2e8f0;
      margin-top: 4px;
      font-size: 11px;
      flex-shrink: 0;
    }
    .pager button {
      padding: 3px 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    /* 右側会計パネル */
    .cart-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-shrink: 0; }
    .cart-head h2 { font-size: 13px; }
    .cart-list { flex: 1; overflow-y: auto; border-top: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; min-height: 50px; }
    .c-item { display: flex; justify-content: space-between; align-items: center; padding: 5px 2px; border-bottom: 1px dashed #e2e8f0; font-size: 11px; gap: 4px; }
    .c-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .c-ctrl { display: flex; align-items: center; gap: 4px; }
    .q-btn { width: 20px; height: 20px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 4px; font-weight: 700; cursor: pointer; }
    .disc-row { display: flex; gap: 4px; margin: 6px 0; flex-shrink: 0; }
    .d-btn { flex: 1; padding: 4px 0; border: 1px solid #cbd5e1; border-radius: 5px; background: #f8fafc; font-size: 10px; font-weight: 700; cursor: pointer; }
    .d-btn.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .sum-box { background: #f8fafc; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; flex-shrink: 0; }
    .sum-line { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 2px; }
    .total-val { font-size: 18px; font-weight: 800; color: #d7000f; }
    .pt-badge { background: #fef3c7; color: #b45309; font-weight: 700; padding: 1px 5px; border-radius: 4px; font-size: 10px; }
    .pay-tabs { display: flex; gap: 4px; margin-bottom: 6px; flex-shrink: 0; }
    .pay-tab { flex: 1; padding: 5px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 11px; font-weight: 700; cursor: pointer; }
    .pay-tab.active { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    .pay-area { flex-shrink: 0; }
    .cash-row { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
    .cash-row input { flex: 1; padding: 5px 6px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 13px; text-align: right; font-weight: 700; }
    .q-cash { display: flex; gap: 4px; margin-bottom: 6px; }
    .q-cash button { flex: 1; padding: 4px; border: 1px solid #cbd5e1; background: #f1f5f9; border-radius: 4px; font-size: 10px; font-weight: 600; cursor: pointer; }
    .cc-box input { width: 100%; padding: 5px 6px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; margin-bottom: 4px; font-family: monospace; }
    .cc-sub { display: flex; gap: 4px; margin-bottom: 4px; }
    .cc-sub input { width: 70px; margin-bottom: 0; text-align: center; }
    .cc-sub button { flex: 1; padding: 4px; font-size: 10px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 5px; cursor: pointer; font-weight: 600; }
    .checkout-btn {
      width: 100%;
      padding: 8px;
      background: #d7000f;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;

    /* モーダル */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 12px;

    .modal-card {
      background: #fff;
      border-radius: 10px;
      padding: 14px;
      width: 100%;
      max-width: 360px;
      max-height: 85dvh;
      overflow-y: auto;

      font-family: monospace;
      background: #fffbeb;

<body>

<header>
  <div class="logo">Joshin POS <span class="badge" id="totalBadge">全12,000商品</span></div>
  <div class="header-btns">
    <button class="h-btn" id="soundBtn" onclick="toggleSound()">🔊 音:ON</button>
    <button class="h-btn" onclick="openStaffModal()">⚙️ 店員設定</button>
  </div>
</header>

<div class="main">
  <!-- 左側：商品カタログ -->
  <div class="panel">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="商品名・メーカー名で検索 (例: ソニー, MacBook, 冷蔵庫)" oninput="resetAndRender()">
      <button onclick="clearSearch()" style="padding:0 8px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;font-size:11px;">クリア</button>
    </div>
    <div class="tabs" id="catTabs"></div>
    <div class="tabs" id="makerTabs"></div>
    <div class="grid-wrap" id="productGrid"></div>
    <div class="pager">
      <span id="pageInfo">0件中 0-0件</span>
      <div style="display:flex;gap:4px;">
        <button onclick="changePage(-1)">◀ 前へ</button>
        <button onclick="changePage(1)">次へ ▶</button>
      </div>
    </div>
  </div>

  <!-- 右側：お会計 -->
  <div class="panel">
    <div class="cart-head">
      <h2>🧾 お会計 (<span id="cartCount">0</span>点)</h2>
      <button onclick="clearCart()" style="font-size:10px;padding:2px 6px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;">全取消</button>
    </div>
    <div class="cart-list" id="cartList"></div>

    <div class="disc-row">
      <button class="d-btn active" onclick="setDisc(0, this)">割引なし</button>
      <button class="d-btn" onclick="setDisc(5, this)">5%OFF</button>
      <button class="d-btn" onclick="setDisc(10, this)">10%OFF</button>
      <button class="d-btn" onclick="setDisc(20, this)">20%OFF</button>
    </div>

    <div class="sum-box">
      <div class="sum-line">
        <span>今回付与ポイント / 累計</span>
        <span class="pt-badge">+10 P（累計: <span id="cumPoints">0</span> P）</span>
      </div>
      <div class="sum-line" style="margin-bottom:0;">
        <span style="font-weight:700;">お支払い合計</span>
        <span class="total-val" id="totalDisplay">0 円</span>
      </div>
    </div>

    <div class="pay-tabs">
      <button class="pay-tab active" id="tabCash" onclick="switchPay('cash')">💴 現金払い</button>
      <button class="pay-tab" id="tabCard" onclick="switchPay('card')">💳 クレジット</button>
    </div>

    <div class="pay-area" id="cashArea">
      <div class="cash-row">
        <span style="font-size:11px;font-weight:700;">お預かり:</span>
        <input type="number" id="depositInput" placeholder="金額" oninput="calcChange()">
        <span style="font-size:11px;font-weight:700;min-width:85px;text-align:right;color:#059669;" id="changeDisplay">お釣り: 0円</span>
      </div>
      <div class="q-cash">
        <button onclick="setExact()">ちょうど</button>
        <button onclick="addDeposit(1000)">+1,000</button>
        <button onclick="addDeposit(5000)">+5,000</button>
        <button onclick="addDeposit(10000)">+10,000</button>
      </div>
      <button class="checkout-btn" onclick="checkoutCash()">現金でお会計完了</button>
    </div>

    <div class="pay-area" id="cardArea" style="display:none;">
      <div class="cc-box">
        <input type="text" id="ccNumInput" placeholder="カード番号16桁 (例: 3867 5889 7657 1243)" maxlength="19">
        <div class="cc-sub">
          <input type="text" id="ccCvcInput" placeholder="コード3桁" maxlength="4">
          <button onclick="fillDefaultCard()">登録カード自動入力</button>
          <button onclick="clearCardInput()">クリア</button>
        </div>
      </div>
      <button class="checkout-btn" style="background:#1d4ed8;" onclick="checkoutCard()">💳 カード認証してお会計</button>
    </div>
  </div>
</div>

<!-- レシートモーダル -->
<div class="modal" id="receiptModal">
  <div class="modal-card">
    <h3 style="font-size:14px;text-align:center;">✅ お会計完了</h3>
    <div class="receipt-paper" id="receiptBody"></div>
    <button class="checkout-btn" onclick="closeModal('receiptModal')">閉じる（次のお会計へ）</button>
  </div>
</div>

<!-- 店員設定モーダル -->
<div class="modal" id="staffModal">
  <div class="modal-card">
    <h3 style="font-size:14px;margin-bottom:8px;">⚙️ 店員設定（クレジットカード登録）</h3>
    <div id="staffLockView">
      <p style="font-size:11px;color:#475569;margin-bottom:6px;">店員暗証番号を入力してください（初期値: 0000）</p>
      <input type="password" id="staffPinInput" placeholder="暗証番号4桁" style="width:100%;padding:6px;border:1px solid #cbd5e1;border-radius:6px;margin-bottom:8px;">
      <div style="display:flex;gap:6px;">
        <button onclick="closeModal('staffModal')" style="flex:1;padding:6px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;">キャンセル</button>
        <button onclick="unlockStaff()" style="flex:1;padding:6px;background:#0f172a;color:#fff;border:none;border-radius:6px;font-weight:700;">ロック解除</button>
      </div>
    </div>
    <div id="staffBodyView" style="display:none;">
      <div style="background:#f8fafc;padding:8px;border-radius:6px;margin-bottom:8px;">
        <div style="font-size:11px;font-weight:700;margin-bottom:4px;">＋ 新しいクレジットカードを登録</div>
        <input type="text" id="newCardNum" placeholder="カード番号16桁 (例: 3867 5889 7657 1243)" style="width:100%;padding:5px;border:1px solid #cbd5e1;border-radius:4px;font-size:11px;margin-bottom:4px;">
        <div style="display:flex;gap:4px;margin-bottom:4px;">
          <input type="text" id="newCardHolder" placeholder="名義人 (例: HINA SHIMIZU)" style="flex:2;padding:5px;border:1px solid #cbd5e1;border-radius:4px;font-size:11px;">
          <input type="text" id="newCardCvc" placeholder="コード(123)" maxlength="4" style="flex:1;padding:5px;border:1px solid #cbd5e1;border-radius:4px;font-size:11px;">
        </div>
        <button onclick="registerNewCard()" style="width:100%;padding:6px;background:#1d4ed8;color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:700;">カードを登録する</button>
      </div>
      <div style="font-size:11px;font-weight:700;margin-bottom:4px;">登録済みカード一覧</div>
      <div id="cardListArea" style="max-height:140px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:6px;padding:4px;margin-bottom:8px;font-size:11px;"></div>
      <div style="font-size:11px;margin-bottom:8px;">累計売上: <strong id="staffSales">0</strong>円 / 累計ポイント: <strong id="staffPts">0</strong>P</div>
      <button onclick="closeModal('staffModal')" style="width:100%;padding:7px;background:#475569;color:#fff;border:none;border-radius:6px;font-weight:700;">設定を閉じる</button>
    </div>
  </div>
</div>

<script>
  // 効果音 (Web Audio API)
  var soundEnabled = true;
  var audioCtx = null;
  function playTone(freq, type, dur, delay) {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (delay || 0));
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime + (delay || 0));
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (delay || 0) + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + (delay || 0));
      osc.stop(audioCtx.currentTime + (delay || 0) + dur);
    } catch (e) {}
  }
  function beepScan() { playTone(1800, 'square', 0.07, 0); }
  function beepOp() { playTone(900, 'sine', 0.06, 0); }
  function beepErr() { playTone(220, 'sawtooth', 0.25, 0); }
  function beepCash() { playTone(1318, 'triangle', 0.12, 0); playTone(1760, 'triangle', 0.35, 0.11); }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 音:ON' : '🔇 音:OFF';

    { cat: '冷蔵庫・洗濯機', maker: '日立', base: '真空チルド・まるごとチルド冷蔵庫', price: 198000, specs: ['401L 5ドア', '470L 6ドア', '540L 6ドア', '617L 6ドア'], colors: ['クリスタルホワイト', 'グラファイトシルバー', 'ライトゴールド'] },
    { cat: '冷蔵庫・洗濯機', maker: '三菱電機', base: '切れちゃう瞬冷凍 冷蔵庫', price: 189000, specs: ['365L 3ドア', '455L 5ドア', '517L 6ドア', '600L 6ドア'], colors: ['グレイングレージュ', 'クリスタルピュアホワイト'] },
    { cat: 'エアコン・空調', maker: 'ダイキン', base: 'うるさらX ルームエアコン', price: 158000, specs: ['おもに6畳用', 'おもに8畳用', 'おもに10畳用', 'おもに14畳用', 'おもに18畳用', 'おもに23畳用'], colors: ['ホワイト', 'ベージュ'] },
    { cat: 'エアコン・空調', maker: 'シャープ', base: 'プラズマクラスター空気清浄機', price: 39800, specs: ['23畳モデル', '31畳加湿モデル', '40畳ハイグレード'], colors: ['ホワイト系', 'グレー系'] },
    { cat: 'キッチン家電', maker: '象印', base: '炎舞炊き 圧力IH炊飯ジャー', price: 69800, specs: ['5.5合炊き', '1升炊き'], colors: ['黒漆', '絹白', '濃墨'] },
    { cat: 'キッチン家電', maker: 'バルミューダ', base: 'BALMUDA The Toaster Pro', price: 37400, specs: ['スチームトースター', 'リベイカー'], colors: ['ブラック', 'ホワイト', 'サラマンダー'] },
    { cat: '掃除機・美容', maker: 'ダイソン', base: 'Dyson V12 Detect Slim コードレス', price: 64800, specs: ['Fluffy', 'Complete', 'Absolute'], colors: ['イエロー/ニッケル', 'アイアン/ニッケル'] },
    { cat: '掃除機・美容', maker: 'パナソニック', base: 'ヘアードライヤー ナノケア', price: 34800, specs: ['高浸透ナノイー', 'コンパクト軽量'], colors: ['ディープネイビー', 'ラベンダーピンク', 'ウォームホワイト'] },
    { cat: 'カメラ・オーディオ', maker: 'ソニー', base: 'α7 IV ミラーレス一眼 / WH-1000XM5', price: 54800, specs: ['ノイズキャンセリング', 'ボディ単体', 'ズームレンズキット'], colors: ['ブラック', 'プラチナシルバー'] },
    { cat: 'ゲーム・ホビー', maker: '任天堂', base: 'Nintendo Switch 有機ELモデル / ソフト', price: 37980, specs: ['本体セット', 'マリオカート8DX', 'ゼルダの伝説', 'スプラトゥーン3', 'Proコントローラー'], colors: ['ホワイト', 'ネオンブルー/レッド'] },
    { cat: 'ゲーム・ホビー', maker: 'バンダイ', base: 'HG/MG/RG ガンプラ 1/144・1/100', price: 2640, specs: ['HG 1/144', 'RG 1/144', 'MG 1/100', 'PG UNLEASHED'], colors: ['RX-78-2', 'フリーダム', 'ユニコーン', 'サザビー', 'エアリアル'] },
    { cat: 'PC周辺・消耗品', maker: 'パナソニック', base: 'エボルタNEO アルカリ乾電池・LED電球', price: 980, specs: ['単3形 10本', '単4形 10本', '単3形 20本', 'LED電球60W形 2個'], colors: ['昼光色', '電球色', '標準パック'] }
  ];

  var ALL_PRODUCTS = [];
  (function buildCatalog() {
    var id = 1;
    var years = ['2024年モデル', '2025年モデル', '2026年モデル', 'Joshinオリジナルモデル', '長期保証付モデル'];
    var idx = 0;
    while (ALL_PRODUCTS.length < 12000) {
      var t = TEMPLATES[idx % TEMPLATES.length];
      var sp = t.specs[Math.floor(idx / TEMPLATES.length) % t.specs.length];
      var cl = t.colors[Math.floor(idx / (TEMPLATES.length * 2)) % t.colors.length];
      var yr = years[Math.floor(idx / (TEMPLATES.length * 4)) % years.length];
      var step = (idx % 9) * 500;
      ALL_PRODUCTS.push({
        id: id++,
        cat: t.cat,
        maker: t.maker,
        name: t.base + ' ' + sp + ' (' + cl + ') [' + yr + ']',
        price: t.price + step
      });
      idx++;
    }
  })();

  // 状態管理
  var currentCat = 'すべて';
  var currentMaker = 'すべて';
  var currentPage = 0;
  var PAGE_SIZE = 60;
  var filteredProducts = ALL_PRODUCTS;
  var cart = [];
  var discountPct = 0;
  var payMode = 'cash';

  var DEFAULT_CARDS = [
    { num: '3867588976571243', holder: 'HINA SHIMIZU', cvc: '123' }
  ];

  function loadStorage(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch (e) { return fallback; }
  }
  function saveStorage(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var registeredCards = loadStorage('joshin_cards_v1', DEFAULT_CARDS);
  var totalPoints = loadStorage('joshin_pts_v1', 0);
  var totalSales = loadStorage('joshin_sales_v1', 0);

  function renderTabs() {
    var cWrap = document.getElementById('catTabs');
    cWrap.innerHTML = '';
    CATEGORIES.forEach(function(c) {
      var b = document.createElement('button');
      b.className = 'tab-btn' + (currentCat === c ? ' active' : '');
      b.textContent = c;
      b.onclick = function() { currentCat = c; beepOp(); resetAndRender(); renderTabs(); };
      cWrap.appendChild(b);
    });

    var mWrap = document.getElementById('makerTabs');
    mWrap.innerHTML = '';
    MAKERS.forEach(function(m) {
      var b = document.createElement('button');
      b.className = 'tab-btn maker-btn' + (currentMaker === m ? ' active' : '');
      b.textContent = m === 'すべて' ? '全メーカー' : m;
      b.onclick = function() { currentMaker = m; beepOp(); resetAndRender(); renderTabs(); };
      mWrap.appendChild(b);
    });
  }

  function resetAndRender() {
    var q = document.getElementById('searchInput').value.trim().toLowerCase();
    filteredProducts = ALL_PRODUCTS.filter(function(p) {
      if (currentCat !== 'すべて' && p.cat !== currentCat) return false;
      if (currentMaker !== 'すべて' && p.maker !== currentMaker) return false;
      if (q && p.name.toLowerCase().indexOf(q) === -1 && p.maker.toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    currentPage = 0;
    renderProducts();
  }

  function clearSearch() {
    document.getElementById('searchInput').value = '';
    beepOp();
    resetAndRender();
  }

  function changePage(delta) {
    var maxPage = Math.max(0, Math.ceil(filteredProducts.length / PAGE_SIZE) - 1);
    currentPage = Math.min(maxPage, Math.max(0, currentPage + delta));
    beepOp();
    renderProducts();
  }

  function renderProducts() {
    var grid = document.getElementById('productGrid');
    grid.innerHTML = '';
    var start = currentPage * PAGE_SIZE;
    var slice = filteredProducts.slice(start, start + PAGE_SIZE);
    slice.forEach(function(p) {
      var card = document.createElement('div');
      card.className = 'p-card';
      card.innerHTML =
        '<div><div class="p-maker">' + p.maker + '</div><div class="p-name">' + p.name + '</div></div>' +
        '<div class="p-price">' + p.price.toLocaleString() + '円</div>';
      card.onclick = function() { addToCart(p); };
      grid.appendChild(card);
    });
    var end = Math.min(filteredProducts.length, start + slice.length);
    document.getElementById('pageInfo').textContent =
      filteredProducts.length.toLocaleString() + '件中 ' + (filteredProducts.length ? start + 1 : 0) + '-' + end + '件';
  }

  function addToCart(p) {
    beepScan();
    var found = null;
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].id === p.id) { found = cart[i]; break; }
    }
    if (found) found.qty++;
    else cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
    renderCart();
  }

  function updateQty(idx, delta) {
    beepOp();
    cart[idx].qty += delta;
    if (cart[idx].qty <= 0) cart.splice(idx, 1);
    renderCart();
  }

  function clearCart() {
    beepOp();
    cart = [];
    document.getElementById('depositInput').value = '';
    renderCart();
  }

  function setDisc(pct, btn) {
    beepOp();
    discountPct = pct;
    var btns = document.querySelectorAll('.d-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    btn.classList.add('active');
    renderCart();
  }

  function getFinalTotal() {
    var sub = 0;
    for (var i = 0; i < cart.length; i++) sub += cart[i].price * cart[i].qty;
    return Math.round(sub * (100 - discountPct) / 100);
  }

  function renderCart() {
    var list = document.getElementById('cartList');
    list.innerHTML = '';
    var count = 0;
    for (var i = 0; i < cart.length; i++) {
      var item = cart[i];
      count += item.qty;
      var row = document.createElement('div');
      row.className = 'c-item';
      row.innerHTML =
        '<div class="c-name">' + item.name + '</div>' +
        '<div class="c-ctrl">' +
          '<button class="q-btn" onclick="updateQty(' + i + ',-1)">-</button>' +
          '<span>' + item.qty + '</span>' +
          '<button class="q-btn" onclick="updateQty(' + i + ',1)">+</button>' +
          '<span style="min-width:58px;text-align:right;font-weight:700;">' + (item.price * item.qty).toLocaleString() + '円</span>' +
        '</div>';
      list.appendChild(row);
    }
    document.getElementById('cartCount').textContent = count;
    document.getElementById('totalDisplay').textContent = getFinalTotal().toLocaleString() + ' 円';
    document.getElementById('cumPoints').textContent = totalPoints.toLocaleString();
    calcChange();
  }

  function switchPay(mode) {
    beepOp();
    payMode = mode;
    document.getElementById('tabCash').classList.toggle('active', mode === 'cash');
    document.getElementById('tabCard').classList.toggle('active', mode === 'card');
    document.getElementById('cashArea').style.display = mode === 'cash' ? 'block' : 'none';
    document.getElementById('cardArea').style.display = mode === 'card' ? 'block' : 'none';
  }

  function calcChange() {
    var total = getFinalTotal();
    var dep = parseInt(document.getElementById('depositInput').value, 10);
    var el = document.getElementById('changeDisplay');
    if (isNaN(dep)) { el.textContent = 'お釣り: 0円'; el.style.color = '#059669'; return; }
    var diff = dep - total;
    if (diff >= 0) {
      el.textContent = 'お釣り: ' + diff.toLocaleString() + '円';
      el.style.color = '#059669';
    } else {
      el.textContent = '不足: ' + Math.abs(diff).toLocaleString() + '円';
      el.style.color = '#dc2626';
    }
  }

  function setExact() {
    beepOp();
    document.getElementById('depositInput').value = getFinalTotal();
    calcChange();
  }

  function addDeposit(amt) {
    beepOp();
    var cur = parseInt(document.getElementById('depositInput').value, 10) || 0;
    document.getElementById('depositInput').value = cur + amt;
    calcChange();
  }

  function fillDefaultCard() {
    beepOp();
    if (registeredCards.length > 0) {
      var c = registeredCards[0];
      document.getElementById('ccNumInput').value = c.num.replace(/(\d{4})(?=\d)/g, '$1 ');
      document.getElementById('ccCvcInput').value = c.cvc;
    }
  }

  function clearCardInput() {
    beepOp();
    document.getElementById('ccNumInput').value = '';
    document.getElementById('ccCvcInput').value = '';
  }

  function checkoutCash() {
    var total = getFinalTotal();
    if (cart.length === 0) { beepErr(); return alert('商品が選択されていません'); }
    var dep = parseInt(document.getElementById('depositInput').value, 10);
    if (isNaN(dep) || dep < total) { beepErr(); return alert('お預かり金額が不足しています'); }
    finishOrder('現金払い', 'お預かり: ' + dep.toLocaleString() + '円 / お釣り: ' + (dep - total).toLocaleString() + '円');
  }

  function checkoutCard() {
    var total = getFinalTotal();
    if (cart.length === 0) { beepErr(); return alert('商品が選択されていません'); }
    var rawNum = document.getElementById('ccNumInput').value.replace(/\s+/g, '');
    var rawCvc = document.getElementById('ccCvcInput').value.trim();
    var matched = null;
    for (var i = 0; i < registeredCards.length; i++) {
      if (registeredCards[i].num === rawNum && registeredCards[i].cvc === rawCvc) {
        matched = registeredCards[i];
        break;
      }
    }
    if (!matched) {
      beepErr();
      return alert('カード番号またはセキュリティコードが一致しません。
(⚙️ 店員設定で登録された番号を確認してください)');
    }
    var authCode = Math.floor(100000 + Math.random() * 900000);
    var last4 = matched.num.slice(-4);
    finishOrder('クレジットカード一括', 'カード: **** **** **** ' + last4 + '<br>名義人: ' + matched.holder + '<br>承認番号: ' + authCode);
  }

  function finishOrder(methodName, extraLine) {
    var total = getFinalTotal();
    beepCash();
    totalSales += total;
    totalPoints += 10;
    saveStorage('joshin_sales_v1', totalSales);
    saveStorage('joshin_pts_v1', totalPoints);

    var lines = '';
    for (var i = 0; i < cart.length; i++) {
      lines += '<div>' + cart[i].name + ' ×' + cart[i].qty + ' : ' + (cart[i].price * cart[i].qty).toLocaleString() + '円</div>';
    }
    var now = new Date().toLocaleString('ja-JP');
    document.getElementById('receiptBody').innerHTML =
      '<div style="text-align:center;font-weight:bold;">Joshin お買い上げレシート</div>' +
      '<div style="font-size:10px;color:#64748b;margin-bottom:6px;">' + now + '</div>' +
      lines +
      '<hr style="margin:6px 0;border:none;border-top:1px dashed #94a3b8;">' +
      '<div>割引: ' + discountPct + '%OFF</div>' +
      '<div style="font-size:13px;font-weight:bold;">合計: ' + total.toLocaleString() + '円</div>' +
      '<div>支払方法: ' + methodName + '</div>' +
      '<div>' + extraLine + '</div>' +
      '<div style="margin-top:4px;font-weight:bold;color:#b45309;">今回獲得ポイント: +10 P (累計: ' + totalPoints.toLocaleString() + ' P)</div>';

    document.getElementById('receiptModal').classList.add('show');
    cart = [];
    document.getElementById('depositInput').value = '';
    clearCardInput();
    renderCart();
  }

  function closeModal(id) {
    beepOp();
    document.getElementById(id).classList.remove('show');
  }

  // 店員設定
  function openStaffModal() {
    beepOp();
    document.getElementById('staffPinInput').value = '';
    document.getElementById('staffLockView').style.display = 'block';
    document.getElementById('staffBodyView').style.display = 'none';
    document.getElementById('staffModal').classList.add('show');
  }

  function unlockStaff() {
    var pin = document.getElementById('staffPinInput').value;
    if (pin !== '0000') { beepErr(); return alert('暗証番号が違います（初期値: 0000）'); }
    beepOp();
    document.getElementById('staffLockView').style.display = 'none';
    document.getElementById('staffBodyView').style.display = 'block';
    renderStaffCards();
  }

  function renderStaffCards() {
    var area = document.getElementById('cardListArea');
    area.innerHTML = '';
    registeredCards.forEach(function(c, idx) {
      var fmt = c.num.replace(/(\d{4})(?=\d)/g, '$1 ');
      var div = document.createElement('div');
      div.style.cssText = 'display:flex;justify-content:space-between;align-items:center;padding:4px;border-bottom:1px solid #f1f5f9;';
      div.innerHTML =
        '<div><strong>' + fmt + '</strong><br><span style="color:#64748b;">' + c.holder + ' / CVC:' + c.cvc + '</span></div>' +
        '<button onclick="deleteCard(' + idx + ')" style="background:#ef4444;color:#fff;border:none;border-radius:4px;padding:2px 6px;font-size:10px;">削除</button>';
      area.appendChild(div);
    });
    document.getElementById('staffSales').textContent = totalSales.toLocaleString();
    document.getElementById('staffPts').textContent = totalPoints.toLocaleString();
  }

  function registerNewCard() {
    var num = document.getElementById('newCardNum').value.replace(/\s+/g, '');
    var holder = document.getElementById('newCardHolder').value.trim().toUpperCase();
    var cvc = document.getElementById('newCardCvc').value.trim();
    if (num.length < 12 || !holder || !cvc) { beepErr(); return alert('カード番号・名義人・コードを正しく入力してください'); }
    beepCash();
    registeredCards.push({ num: num, holder: holder, cvc: cvc });
    saveStorage('joshin_cards_v1', registeredCards);
    document.getElementById('newCardNum').value = '';
    document.getElementById('newCardHolder').value = '';
    document.getElementById('newCardCvc').value = '';
    renderStaffCards();
  }

  function deleteCard(idx) {
    beepOp();
    registeredCards.splice(idx, 1);
    saveStorage('joshin_cards_v1', registeredCards);
    renderStaffCards();
  }

  // 初期起動
  renderTabs();
  renderProducts();
  renderCart();
</script>
</body>
</html>
