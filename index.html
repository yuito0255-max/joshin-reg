<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>家電量販店 POSレジシステム</title>
  <style>
    :root {
      --primary: #d90429;
      --primary-dark: #b00020;
      --accent: #00509d;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Segoe UI", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sound-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }
    .sound-btn.off {
      background: rgba(0,0,0,0.3);
      color: #cbd5e1;
    }
    .main-layout {
      display: grid;
      grid-template-columns: 1.45fr 1fr;
      gap: 12px;
      padding: 12px;
      flex: 1;
      overflow: hidden;
    }
    @media (max-width: 820px) {
      body { height: auto; overflow: auto; }
      .main-layout { grid-template-columns: 1fr; overflow: visible; }
    }
    .panel {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .left-header {
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-box {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .cat-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .cat-tabs::-webkit-scrollbar { height: 4px; }
    .cat-tabs::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .cat-tab {
      background: white;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 18px;
      font-size: 0.82rem;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      color: #475569;
    }
    .cat-tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .product-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 8px;
    }
    .prod-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 8px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.06s, background 0.1s;
      min-height: 76px;
    }
    .prod-card:active {
      transform: scale(0.96);
      background: #eff6ff;
      border-color: var(--accent);
    }
    .prod-maker {
      font-size: 0.7rem;
      color: #64748b;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .prod-name {
      font-size: 0.84rem;
      font-weight: bold;
      color: #0f172a;
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .prod-price {
      font-size: 0.92rem;
      font-weight: bold;
      color: var(--primary);
      text-align: right;
    }
    .custom-add {
      padding: 8px 12px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .custom-add input {
      padding: 6px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    .custom-add button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    /* 右側会計エリア */
    .cart-header {
      padding: 10px 14px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .cart-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      margin: 0;
      list-style: none;
    }
    .cart-empty {
      text-align: center;
      color: #94a3b8;
      margin-top: 40px;
      font-size: 0.9rem;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f1f5f9;
      gap: 8px;
    }
    .cart-item-info { flex: 1; min-width: 0; }
    .cart-item-title {
      font-size: 0.86rem;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cart-item-sub { font-size: 0.78rem; color: #64748b; }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .del-btn {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.78rem;
      font-weight: bold;
      cursor: pointer;
    }
    .checkout-box {
      padding: 10px 14px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .discount-row {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .disc-btn {
      flex: 1;
      padding: 5px 0;
      font-size: 0.78rem;
      font-weight: bold;
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 6px;
      cursor: pointer;
    }
    .disc-btn.active {
      background: #f59e0b;
      color: white;
      border-color: #d97706;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 0.9rem;
    }
    .total-price {
      font-size: 1.55rem;
      font-weight: bold;
      color: var(--primary);
    }
    .point-badge {
      background: #fef3c7;
      color: #b45309;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .deposit-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0 6px 0;
      gap: 8px;
    }
    .deposit-input {
      width: 140px;
      padding: 6px 10px;
      font-size: 1.1rem;
      font-weight: bold;
      text-align: right;
      border: 2px solid var(--accent);
      border-radius: 6px;
    }
    .quick-cash {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .cash-btn {
      flex: 1;
      padding: 6px 2px;
      font-size: 0.78rem;
      font-weight: bold;
      background: #e2e8f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .cash-btn:active { background: #cbd5e1; }
    .change-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: white;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      margin-bottom: 8px;
    }
    .change-val {
      font-size: 1.25rem;
      font-weight: bold;
      color: #059669;
    }
    .action-btns {
      display: flex;
      gap: 8px;
    }
    .clear-btn {
      flex: 1;
      padding: 12px;
      background: white;
      border: 1px solid #94a3b8;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .pay-btn {
      flex: 2.2;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
    }
    .pay-btn:active { background: var(--primary-dark); }
    .sales-bar {
      margin-top: 6px;
      font-size: 0.78rem;
      color: #475569;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* モーダル */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .modal-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .receipt-text {
      text-align: left;
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.85rem;
      margin: 12px 0;
      max-height: 240px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<header>
  <h1>🏪 家電・PC・ホビー POSレジ</h1>
  <div class="header-controls">
    <button id="soundToggle" class="sound-btn" onclick="toggleSound()">🔊 音: ON</button>
  </div>
</header>

<div class="main-layout">
  <!-- 左側：商品検索＆一覧 -->
  <div class="panel">
    <div class="left-header">
      <input type="text" id="searchInput" class="search-box" placeholder="🔍 商品名・メーカー名で検索 (例: MacBook, ソニー, ガンプラ)" oninput="renderProducts()">
      <div class="cat-tabs" id="catTabs"></div>
    </div>
    <div class="product-area">
      <div class="product-grid" id="productGrid"></div>
    </div>
    <div class="custom-add">
      <input type="text" id="customMaker" placeholder="メーカー" style="width: 85px;">
      <input type="text" id="customName" placeholder="自由入力の商品名" style="flex: 1;">
      <input type="number" id="customPrice" placeholder="税込価格" style="width: 95px;">
      <button onclick="addCustomProduct()">+ 登録</button>
    </div>
  </div>

  <!-- 右側：お会計カート -->
  <div class="panel">
    <div class="cart-header">
      <span>🧾 お買上明細</span>
      <span id="itemCountBadge" style="font-size:0.85rem; color:#475569;">0点</span>
    </div>
    <ul class="cart-list" id="cartList">
      <li class="cart-empty">左の商品をタップして追加してください</li>
    </ul>
    <div class="checkout-box">
      <div class="discount-row">
        <button class="disc-btn active" onclick="setDiscount(0, this)">割引なし</button>
        <button class="disc-btn" onclick="setDiscount(5, this)">5%OFF</button>
        <button class="disc-btn" onclick="setDiscount(10, this)">10%OFF</button>
        <button class="disc-btn" onclick="setDiscount(20, this)">20%OFF</button>
      </div>
      <div class="summary-row">
        <span>合計（税込）</span>
        <span class="point-badge" id="pointDisplay">+0 pt 還元</span>
        <span class="total-price" id="totalDisplay">0 円</span>
      </div>
      <div class="deposit-area">
        <span style="font-weight:bold; font-size:0.9rem;">お預かり</span>
        <input type="number" id="depositInput" class="deposit-input" placeholder="0" oninput="updateChange()">
      </div>
      <div class="quick-cash">
        <button class="cash-btn" onclick="setExactCash()">ちょうど</button>
        <button class="cash-btn" onclick="addCash(1000)">+1,000円</button>
        <button class="cash-btn" onclick="addCash(5000)">+5,000円</button>
        <button class="cash-btn" onclick="addCash(10000)">+1万円</button>
        <button class="cash-btn" onclick="clearCash()">クリア</button>
      </div>
      <div class="change-row">
        <span style="font-weight:bold; font-size:0.9rem;">お釣り</span>
        <span class="change-val" id="changeDisplay">0 円</span>
      </div>
      <div class="action-btns">
        <button class="clear-btn" onclick="clearCart()">取消</button>
        <button class="pay-btn" onclick="completeCheckout()">会計完了</button>
      </div>
      <div class="sales-bar">
        <span>本日売上: <strong id="dailySales">0</strong>円 (<span id="dailyCount">0</span>件)</span>
        <button onclick="resetSales()" style="border:none; background:none; color:#64748b; text-decoration:underline; cursor:pointer; font-size:0.75rem;">売上リセット</button>
      </div>
    </div>
  </div>
</div>

<!-- 会計完了レシートモーダル -->
<div class="modal-bg" id="receiptModal">
  <div class="modal-box">
    <h3 style="margin:0 0 8px 0; color:var(--primary);">✅ お会計完了</h3>
    <div class="receipt-text" id="receiptBody"></div>
    <button class="pay-btn" style="width:100%;" onclick="closeModal()">次の会計へ</button>
  </div>
</div>

<script>
  // 効果音エンジン (Web Audio API)
  let soundEnabled = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playBeep(type) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    if (type === 'scan') {
      // バーコードスキャナ音「ピッ！」
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2100, now);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    } else if (type === 'tap') {
      // 軽快な操作音
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(900, now);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.06);
    } else if (type === 'cash') {
      // レジベル音「チャリーン♪」
      [1318.5, 1975.5].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        const start = now + idx * 0.09;
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.22, start);
        gain.gain.exponentialRampToValueAtTime(0.001, start + 0.45);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.45);
      });
    }
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundToggle');
    btn.textContent = soundEnabled ? '🔊 音: ON' : '🔇 音: OFF';
    btn.classList.toggle('off', !soundEnabled);
    if (soundEnabled) playBeep('tap');
  }

    { id: 1003, cat: "電池・照明・日用品", maker: "花王", name: "アタックZERO 洗濯洗剤 詰め替え 特大", price: 980 },
    { id: 1004, cat: "電池・照明・日用品", maker: "大王製紙", name: "エリエール ティッシュペーパー 5箱パック", price: 498 },

  let products = [...INITIAL_PRODUCTS];
  let currentCat = "すべて";
  let cart = [];
  let discountPercent = 0;
  let dailySales = 0;
  let dailyCount = 0;

  try {
    const savedProds = localStorage.getItem('joshin_pos_products_v8');
    if (savedProds) products = JSON.parse(savedProds);
    const savedSales = localStorage.getItem('joshin_pos_sales_v8');
    if (savedSales) {
      const parsed = JSON.parse(savedSales);
      dailySales = parsed.total || 0;
      dailyCount = parsed.count || 0;
    }
  } catch (e) {}

  function saveStorage() {
    try {
      localStorage.setItem('joshin_pos_products_v8', JSON.stringify(products));
      localStorage.setItem('joshin_pos_sales_v8', JSON.stringify({ total: dailySales, count: dailyCount }));
    } catch (e) {}
  }

  function renderTabs() {
    const cats = ["すべて", ...new Set(products.map(p => p.cat))];
    const container = document.getElementById('catTabs');
    container.innerHTML = '';
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-tab' + (cat === currentCat ? ' active' : '');
      btn.textContent = cat;
      btn.onclick = () => {
        playBeep('tap');
        currentCat = cat;
        renderTabs();
        renderProducts();
      };
      container.appendChild(btn);
    });
  }

  function renderProducts() {
    const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';

    const filtered = products.filter(p => {
      const matchCat = (currentCat === "すべて" || p.cat === currentCat);
      const matchKey = !keyword || p.name.toLowerCase().includes(keyword) || p.maker.toLowerCase().includes(keyword);
      return matchCat && matchKey;
    });

    filtered.forEach(p => {
      const card = document.createElement('div');
      card.className = 'prod-card';
      card.innerHTML = `
        <div>
          <div class="prod-maker">${p.maker}</div>
          <div class="prod-name">${p.name}</div>
        </div>
        <div class="prod-price">${p.price.toLocaleString()}円</div>
      `;
      card.onclick = () => addToCart(p);
      grid.appendChild(card);
    });
  }

  function addCustomProduct() {
    const maker = document.getElementById('customMaker').value.trim() || "その他";
    const name = document.getElementById('customName').value.trim();
    const price = parseInt(document.getElementById('customPrice').value, 10);
    if (!name || isNaN(price) || price < 0) {
      alert('商品名と正しい価格を入力してください');
      return;
    }
    playBeep('tap');
    const newProd = { id: Date.now(), cat: "追加商品", maker, name, price };
    products.unshift(newProd);
    saveStorage();
    document.getElementById('customMaker').value = '';
    document.getElementById('customName').value = '';
    document.getElementById('customPrice').value = '';
    currentCat = "すべて";
    renderTabs();
    renderProducts();
  }

  function addToCart(prod) {
    playBeep('scan');
    const existing = cart.find(item => item.id === prod.id);
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ ...prod, qty: 1 });
    }
    renderCart();
  }

  function changeQty(id, delta) {
    playBeep('tap');
    const item = cart.find(i => i.id === id);
    if (!item) return;
    item.qty += delta;
    if (item.qty <= 0) {
      cart = cart.filter(i => i.id !== id);
    }
    renderCart();
  }

  function removeItem(id) {
    playBeep('tap');
    cart = cart.filter(i => i.id !== id);
    renderCart();
  }

  function setDiscount(pct, btnEl) {
    playBeep('tap');
    discountPercent = pct;
    document.querySelectorAll('.disc-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    renderCart();
  }

  function getTotals() {
    const rawTotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
    const discountAmount = Math.floor(rawTotal * (discountPercent / 100));
    const finalTotal = rawTotal - discountAmount;
    const points = Math.floor(finalTotal * 0.01);
    const count = cart.reduce((sum, i) => sum + i.qty, 0);
    return { rawTotal, discountAmount, finalTotal, points, count };
  }

  function renderCart() {
    const list = document.getElementById('cartList');
    list.innerHTML = '';

    if (cart.length === 0) {
      list.innerHTML = '<li class="cart-empty">左の商品をタップして追加してください</li>';
    } else {
      cart.forEach(item => {
        const li = document.createElement('li');
        li.className = 'cart-item';
        li.innerHTML = `
          <div class="cart-item-info">
            <div class="cart-item-title">[${item.maker}] ${item.name}</div>
            <div class="cart-item-sub">${item.price.toLocaleString()}円 × ${item.qty} = <strong>${(item.price * item.qty).toLocaleString()}円</strong></div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
            <span style="min-width:20px; text-align:center; font-weight:bold;">${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">＋</button>
            <button class="del-btn" onclick="removeItem(${item.id})">削除</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    const { finalTotal, points, count } = getTotals();
    document.getElementById('itemCountBadge').textContent = `${count}点`;
    document.getElementById('totalDisplay').textContent = `${finalTotal.toLocaleString()} 円`;
    document.getElementById('pointDisplay').textContent = `+${points.toLocaleString()} pt 還元`;
    updateChange();
  }

  function updateChange() {
    const { finalTotal } = getTotals();
    const deposit = parseInt(document.getElementById('depositInput').value, 10);
    const changeEl = document.getElementById('changeDisplay');

    if (isNaN(deposit) || deposit === 0) {
      changeEl.textContent = '0 円';
      changeEl.style.color = '#059669';
      return;
    }
    const diff = deposit - finalTotal;
    if (diff >= 0) {
      changeEl.textContent = `${diff.toLocaleString()} 円`;
      changeEl.style.color = '#059669';
    } else {
      changeEl.textContent = `不足 ${Math.abs(diff).toLocaleString()} 円`;
      changeEl.style.color = '#dc2626';
    }
  }

  function setExactCash() {
    playBeep('tap');
    const { finalTotal } = getTotals();
    document.getElementById('depositInput').value = finalTotal;
    updateChange();
  }

  function addCash(amount) {
    playBeep('tap');
    const cur = parseInt(document.getElementById('depositInput').value, 10) || 0;
    document.getElementById('depositInput').value = cur + amount;
    updateChange();
  }

  function clearCash() {
    playBeep('tap');
    document.getElementById('depositInput').value = '';
    updateChange();
  }

  function clearCart() {
    playBeep('tap');
    cart = [];
    document.getElementById('depositInput').value = '';
    renderCart();
  }

  function completeCheckout() {
    const { rawTotal, discountAmount, finalTotal, points, count } = getTotals();
    if (count === 0) {
      alert('商品が選択されていません');
      return;
    }
    const depositInput = parseInt(document.getElementById('depositInput').value, 10);
    const deposit = isNaN(depositInput) ? finalTotal : depositInput;
    if (deposit < finalTotal) {
      alert(`お預かり金額が ${(finalTotal - deposit).toLocaleString()}円 不足しています`);
      return;
    }

    playBeep('cash');
    const change = deposit - finalTotal;
    dailySales += finalTotal;
    dailyCount += 1;
    saveStorage();
    updateSalesBar();

    const nowStr = new Date().toLocaleString('ja-JP');
    let lines = [
      `日時: ${nowStr}`,
      `--------------------------------`,
      ...cart.map(i => `${i.maker} ${i.name}
  ${i.price.toLocaleString()}円 x ${i.qty}点 = ${(i.price * i.qty).toLocaleString()}円`),
      `--------------------------------`,
      `小計 (${count}点): ${rawTotal.toLocaleString()}円`
    ];
    if (discountPercent > 0) {
      lines.push(`割引 (${discountPercent}%OFF): -${discountAmount.toLocaleString()}円`);
    }
    lines.push(
      `合計金額: ${finalTotal.toLocaleString()}円`,
      `お預かり: ${deposit.toLocaleString()}円`,
      `お釣り  : ${change.toLocaleString()}円`,
      `獲得ポイント: ${points.toLocaleString()} pt`
    );

    document.getElementById('receiptBody').textContent = lines.join('
');
    document.getElementById('receiptModal').style.display = 'flex';
  }

  function closeModal() {
    playBeep('tap');
    document.getElementById('receiptModal').style.display = 'none';
    cart = [];
    document.getElementById('depositInput').value = '';
    renderCart();
  }

  function updateSalesBar() {
    document.getElementById('dailySales').textContent = dailySales.toLocaleString();
    document.getElementById('dailyCount').textContent = dailyCount;
  }

  function resetSales() {
    if (confirm('本日の売上累計をリセットしますか？')) {
      playBeep('tap');
      dailySales = 0;
      dailyCount = 0;
      saveStorage();
      updateSalesBar();
    }
  }

  // 初期化
  renderTabs();
  renderProducts();
  renderCart();
  updateSalesBar();
</script>
