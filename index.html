<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Joshin POSレジ (全12,000商品・コンパクト版)</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      font-size: 13px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #dc2626;
      color: #fff;
      height: 40px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .brand { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; }
    .badge { background: #fef08a; color: #991b1b; font-size: 10px; padding: 1px 6px; border-radius: 99px; font-weight: bold; }
    .header-btns { display: flex; gap: 6px; }
    .h-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 5px;
      cursor: pointer;
    }
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 8px;
      padding: 8px;
      overflow: hidden;
    }
    @media (max-width: 720px) {
      body { height: auto; overflow: auto; }
      .main { grid-template-columns: 1fr; overflow: visible; }
    }
    .panel {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px;
    }
    .filter-bar { display: flex; gap: 4px; margin-bottom: 6px; flex-shrink: 0; }
    .filter-bar input, .filter-bar select {
      padding: 4px 6px;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 12px;
    }
    .filter-bar input { flex: 1; }
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .tab {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 99px;
      padding: 2px 8px;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab.active { background: #dc2626; color: #fff; border-color: #dc2626; font-weight: bold; }
    .grid {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 6px;
      align-content: start;
    }
    .card {
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      border-radius: 6px;
      padding: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 58px;
    }
    .card:active { background: #fee2e2; border-color: #ef4444; }
    .c-maker { font-size: 9px; color: #64748b; font-weight: bold; }
    .c-name { font-size: 11px; font-weight: 600; line-height: 1.25; margin: 2px 0; }
    .c-price { font-size: 12px; font-weight: 800; color: #dc2626; }
    .pager {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 6px;
      border-top: 1px solid #f1f5f9;
      font-size: 11px;
      flex-shrink: 0;
    }
    .pager button { padding: 2px 8px; font-size: 11px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; cursor: pointer; }
    .cart-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      margin: 0 0 6px 0;
      padding: 0;
      border-bottom: 1px solid #e2e8f0;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px dashed #e2e8f0;
      font-size: 11px;
    }
    .qty-btns button {
      padding: 1px 6px;
      font-size: 11px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 3px;
      cursor: pointer;
    }
    .summary { background: #f8fafc; padding: 6px 8px; border-radius: 6px; margin-bottom: 6px; flex-shrink: 0; }
    .s-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px; font-size: 12px; }
    .total-val { font-size: 18px; font-weight: 900; color: #dc2626; }
    .disc-btns { display: flex; gap: 3px; margin-bottom: 4px; }
    .disc-btn { flex: 1; font-size: 10px; padding: 2px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; cursor: pointer; }
    .disc-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .pay-tabs { display: flex; gap: 4px; margin-bottom: 6px; flex-shrink: 0; }
    .pay-tab { flex: 1; padding: 5px; font-size: 11px; font-weight: bold; border: 1px solid #cbd5e1; background: #f1f5f9; border-radius: 5px; cursor: pointer; }
    .pay-tab.active { background: #0f172a; color: #fff; border-color: #0f172a; }
    .pay-box { flex-shrink: 0; }
    .quick-cash { display: flex; gap: 3px; margin: 4px 0; }
    .quick-cash button { flex: 1; font-size: 10px; padding: 3px; border: 1px solid #cbd5e1; background: #fff; border-radius: 4px; cursor: pointer; }
    .cc-input { width: 100%; padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 12px; margin-bottom: 4px; font-family: monospace; }
    .action-row { display: flex; gap: 6px; margin-top: 6px; }
    .btn-clear { flex: 1; padding: 8px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; cursor: pointer; }
    .btn-pay { flex: 2; padding: 8px; background: #dc2626; color: #fff; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .pt-bar { font-size: 11px; color: #b45309; background: #fef3c7; padding: 3px 6px; border-radius: 4px; margin-bottom: 4px; display: flex; justify-content: space-between; font-weight: bold; }
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      align-items: center; justify-content: center; z-index: 100; padding: 12px;
    }
    .modal.open { display: flex; }
    .modal-body {
      background: #fff; border-radius: 10px; padding: 14px; width: 100%; max-width: 380px;
      max-height: 85vh; overflow-y: auto; font-size: 12px;
    }
    .receipt { font-family: monospace; background: #fffbeb; border: 1px dashed #94a3b8; padding: 10px; line-height: 1.5; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <span>Joshin レジ</span>
    <span class="badge" id="itemCountBadge">12,000商品</span>
  </div>
  <div class="header-btns">
    <button class="h-btn" id="soundBtn" onclick="toggleSound()">🔊 音:ON</button>
    <button class="h-btn" onclick="openStaffModal()">⚙️ 店員設定</button>
  </div>
</header>

<div class="main">
  <!-- 左：商品一覧 -->
  <div class="panel">
    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="商品名・メーカー検索..." oninput="resetPageAndRender()">
      <select id="makerSelect" onchange="resetPageAndRender()">
        <option value="">全メーカー</option>
      </select>
    </div>
    <div class="tabs" id="catTabs"></div>
    <div class="grid" id="productGrid"></div>
    <div class="pager">
      <button onclick="changePage(-1)">◀ 前へ</button>
      <span id="pageInfo">1 / 200 ページ</span>
      <button onclick="changePage(1)">次へ ▶</button>
    </div>
  </div>

  <!-- 右：お会計 -->
  <div class="panel">
    <div class="pt-bar">
      <span>毎回付与: +10 P</span>
      <span>累計ポイント: <span id="totalPoints">0</span> P</span>
    </div>
    <ul class="cart-list" id="cartList"></ul>

    <div class="summary">
      <div class="disc-btns">
        <button class="disc-btn active" onclick="setDisc(0, this)">割引なし</button>
        <button class="disc-btn" onclick="setDisc(5, this)">5%OFF</button>
        <button class="disc-btn" onclick="setDisc(10, this)">10%OFF</button>
        <button class="disc-btn" onclick="setDisc(20, this)">20%OFF</button>
      </div>
      <div class="s-row">
        <span>お買上点数: <strong id="totalQty">0</strong>点</span>
        <span>合計: <span class="total-val" id="totalPrice">0円</span></span>
      </div>
    </div>

    <div class="pay-tabs">
      <button class="pay-tab active" id="tabCash" onclick="switchPay('cash')">💴 現金払い</button>
      <button class="pay-tab" id="tabCard" onclick="switchPay('card')">💳 クレジット</button>
    </div>

    <div class="pay-box" id="cashBox">
      <div class="s-row">
        <span>お預かり</span>
        <input type="number" id="depositInput" placeholder="金額" oninput="calcChange()" style="width:110px; padding:4px; text-align:right; border:1px solid #cbd5e1; border-radius:4px;">
      </div>
      <div class="quick-cash">
        <button onclick="setExact()">ちょうど</button>
        <button onclick="addCash(1000)">+1千</button>
        <button onclick="addCash(5000)">+5千</button>
        <button onclick="addCash(10000)">+1万</button>
      </div>
      <div class="s-row" style="margin-bottom:0;">
        <span>お釣り</span>
        <strong id="changePrice" style="color:#059669; font-size:14px;">0円</strong>
      </div>
    </div>

    <div class="pay-box" id="cardBox" style="display:none;">
      <input type="text" class="cc-input" id="ccNumInput" placeholder="カード番号16桁 (例: 3867 5889 7657 1243)" maxlength="19">
      <div style="display:flex; gap:4px;">
        <input type="text" class="cc-input" id="ccCvvInput" placeholder="裏面3桁 (例: 123)" maxlength="4" style="flex:1;">
        <select id="ccPayType" style="flex:1; padding:4px; border:1px solid #cbd5e1; border-radius:4px; font-size:11px; margin-bottom:4px;">
          <option value="一括払い">一括払い</option>
          <option value="2回払い">2回払い</option>
          <option value="ボーナス一括">ボーナス一括</option>
        </select>
      </div>
      <div style="display:flex; gap:4px;">
        <button type="button" onclick="fillDefaultCard()" style="flex:1; font-size:10px; padding:3px; border:1px solid #cbd5e1; background:#f8fafc; border-radius:4px; cursor:pointer;">登録番号入力</button>
        <button type="button" onclick="clearCardInput()" style="flex:1; font-size:10px; padding:3px; border:1px solid #cbd5e1; background:#f8fafc; border-radius:4px; cursor:pointer;">クリア</button>
      </div>
    </div>

    <div class="action-row">
      <button class="btn-clear" onclick="clearCart()">取消</button>
      <button class="btn-pay" onclick="checkout()">会計完了 (+10P)</button>
    </div>
  </div>
</div>

<!-- レシートモーダル -->
<div class="modal" id="receiptModal">
  <div class="modal-body">
    <h3 style="margin:0 0 8px 0; text-align:center;">🧾 お買い上げレシート</h3>
    <div class="receipt" id="receiptContent"></div>
    <button onclick="closeModal('receiptModal')" style="width:100%; margin-top:10px; padding:8px; background:#dc2626; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">閉じる</button>
  </div>
</div>

<!-- 店員設定モーダル -->
<div class="modal" id="staffModal">
  <div class="modal-body">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <h3 style="margin:0;">⚙️ 店員設定（カード登録）</h3>
      <button onclick="closeModal('staffModal')" style="border:none; background:none; font-size:16px; cursor:pointer;">✕</button>
    </div>
    <div id="staffLockBox">
      <p style="margin:0 0 6px 0;">店員暗証番号を入力してください（初期: 0000）</p>
      <input type="password" id="staffPinInput" placeholder="0000" style="width:100%; padding:6px; border:1px solid #cbd5e1; border-radius:4px; margin-bottom:8px;">
      <button onclick="unlockStaff()" style="width:100%; padding:8px; background:#0f172a; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">ロック解除</button>
    </div>
    <div id="staffContentBox" style="display:none;">
      <div style="background:#f1f5f9; padding:8px; border-radius:6px; margin-bottom:8px;">
        <strong>＋ 新しいクレジットカードを登録</strong>
        <input type="text" id="regCcNum" placeholder="カード番号16桁 (例: 4111 2222 3333 4444)" style="width:100%; padding:5px; margin-top:4px; border:1px solid #cbd5e1; border-radius:4px;">
        <input type="text" id="regCcName" placeholder="名義人ローマ字 (例: TARO YAMADA)" style="width:100%; padding:5px; margin-top:4px; border:1px solid #cbd5e1; border-radius:4px;">
        <input type="text" id="regCcCvv" placeholder="セキュリティコード3桁 (例: 123)" maxlength="4" style="width:100%; padding:5px; margin-top:4px; border:1px solid #cbd5e1; border-radius:4px;">
        <button onclick="registerNewCard()" style="width:100%; margin-top:6px; padding:6px; background:#2563eb; color:#fff; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">カードを登録する</button>
      </div>
      <strong>登録済みカード一覧</strong>
      <div id="registeredCardList" style="margin:6px 0 10px 0;"></div>
      <div style="border-top:1px solid #e2e8f0; padding-top:8px;">
        <div>本日売上: <strong id="staffSales">0</strong>円 / 累計付与PT: <strong id="staffPts">0</strong>P</div>
        <button onclick="resetAllData()" style="margin-top:6px; font-size:11px; color:#dc2626; background:#fee2e2; border:1px solid #fecaca; padding:4px 8px; border-radius:4px; cursor:pointer;">売上・ポイントをリセット</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var audioCtx = null;
  var soundEnabled = true;

  function playBeep(freq, dur, type) {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  window.toggleSound = function() {
    soundEnabled = !soundEnabled;
    document.getElementById("soundBtn").textContent = soundEnabled ? "🔊 音:ON" : "🔇 音:OFF";

    { cat: "エアコン・空調", maker: "富士通ゼネラル", base: "ノクリア エアコン", specs: ["6畳用", "8畳用", "10畳用", "14畳用"], price: 98000, step: 18000 },

    { cat: "キッチン家電", maker: "象印", base: "炎舞炊き 圧力IH炊飯ジャー", specs: ["5.5合 濃墨", "5.5合 絹白", "1升 濃墨"], price: 79800, step: 12000 },
    { cat: "キッチン家電", maker: "タイガー", base: "土鍋ご泡火炊き 炊飯器", specs: ["5.5合", "1升", "5.5合 プレミアム"], price: 84800, step: 14000 },
    { cat: "キッチン家電", maker: "バルミューダ", base: "The Toaster スチームトースター", specs: ["ブラック", "ホワイト", "ショコラ", "Proモデル"], price: 29700, step: 4000 },
    { cat: "キッチン家電", maker: "シャープ", base: "ヘルシオ ウォーターオーブン", specs: ["22L 1段", "30L 2段", "30L プレミアム"], price: 69800, step: 25000 },
    { cat: "キッチン家電", maker: "デロンギ", base: "マグニフィカ 全自動コーヒーマシン", specs: ["ブラック", "シルバー", "ラテクレマ搭載"], price: 79800, step: 28000 },

    { cat: "掃除機・美容", maker: "ダイソン", base: "V12 Detect Slim コードレス", specs: ["Fluffy", "Absolute", "Submarine水拭き"], price: 69800, step: 15000 },
    { cat: "掃除機・美容", maker: "iRobot", base: "ルンバ ロボット掃除機", specs: ["i5+", "j7+", "j9+ コンボ", "Max 10"], price: 69800, step: 25000 },
    { cat: "掃除機・美容", maker: "パナソニック", base: "ヘアードライヤー ナノケア", specs: ["EH-NA0J ネイビー", "EH-NA0J ピンク", "EH-NC50 高浸透"], price: 34800, step: 12000 },
    { cat: "掃除機・美容", maker: "ブラウン", base: "シリーズ9 Pro+ 電気シェーバー", specs: ["洗浄機付き", "美顔器ヘッド付き", "トラベルケース付"], price: 42800, step: 8000 },

    { cat: "カメラ・オーディオ", maker: "ソニー", base: "α7 IV ミラーレス一眼", specs: ["ボディのみ", "ズームレンズキット", "α7C II ボディ"], price: 328000, step: 25000 },
    { cat: "カメラ・オーディオ", maker: "ソニー", base: "WF-1000XM5 ワイヤレスイヤホン", specs: ["ブラック", "プラチナシルバー", "WH-1000XM5 ヘッドホン"], price: 36800, step: 6000 },
    { cat: "カメラ・オーディオ", maker: "キヤノン", base: "EOS R6 Mark II", specs: ["ボディ", "24-105 IS STMキット", "EOS R8 ボディ"], price: 348000, step: 30000 },
    { cat: "カメラ・オーディオ", maker: "ニコン", base: "Z6III ミラーレスカメラ", specs: ["ボディ", "24-120 レンズキット", "Zf ボディ"], price: 388000, step: 35000 },

    { cat: "ゲーム・ホビー", maker: "任天堂", base: "Nintendo Switch 本体", specs: ["有機EL ホワイト", "有機EL ネオン", "Lite ターコイズ", "Lite ブルー"], price: 37980, step: -4000 },
    { cat: "ゲーム・ホビー", maker: "任天堂", base: "Switch 人気ソフト", specs: ["マリオカート8DX", "スプラトゥーン3", "ゼルダの伝説 ティアキン", "スマブラSP"], price: 6578, step: 400 },
    { cat: "ゲーム・ホビー", maker: "SIE", base: "PlayStation 5 本体", specs: ["通常版 1TB", "デジタルエディション", "PS5 Pro 2TB"], price: 79980, step: 15000 },
    { cat: "ゲーム・ホビー", maker: "バンダイ", base: "ガンプラ 1/144 & 1/100", specs: ["HG ガンダム", "RG ジオング", "MG サザビー Ver.Ka", "PG ストライク"], price: 2420, step: 3500 },
    { cat: "ゲーム・ホビー", maker: "KATO", base: "Nゲージ 鉄道模型セット", specs: ["東海道新幹線 N700S", "山手線 E235系", "スターターセット"], price: 14800, step: 4500 },

    { cat: "PC周辺・消耗品", maker: "ロジクール", base: "MX Master 3S ワイヤレスマウス", specs: ["グラファイト", "ペイルグレー", "MX Keys S キーボード"], price: 15800, step: 1500 },
    { cat: "PC周辺・消耗品", maker: "バッファロー", base: "Wi-Fi 7 ルーター", specs: ["エントリーモデル", "ミドルハイモデル", "フラッグシップ"], price: 14800, step: 12000 },
    { cat: "PC周辺・消耗品", maker: "エプソン", base: "カラリオ プリンター", specs: ["EP-886AW ホワイト", "EP-886AB ブラック", "エコタンク搭載モデル"], price: 29800, step: 8000 },
    { cat: "PC周辺・消耗品", maker: "パナソニック", base: "エボルタNEO アルカリ乾電池", specs: ["単3形 12本パック", "単4形 12本パック", "単3形 20本パック"], price: 1480, step: 400 }
  ];

  // 12,000商品を高速生成
  var allProducts = [];
  var makersSet = {};
  var idCounter = 1;
  var colors = ["標準モデル", "ホワイト", "ブラック", "シルバー", "シャンパンゴールド", "ネイビー"];
  var years = ["2025年モデル", "2026年最新モデル", "Joshinオリジナル仕様", "長期保証付セット"];

  while (allProducts.length < 12000) {
    for (var i = 0; i < templates.length && allProducts.length < 12000; i++) {
      var t = templates[i];
      makersSet[t.maker] = true;
      for (var s = 0; s < t.specs.length && allProducts.length < 12000; s++) {
        var cIdx = (idCounter + s) % colors.length;
        var yIdx = Math.floor(idCounter / templates.length) % years.length;
        var calcPrice = Math.max(500, t.price + (t.step * s) + (yIdx * 1000));
        allProducts.push({
          id: idCounter++,
          cat: t.cat,
          maker: t.maker,
          name: t.maker + " " + t.base + " (" + t.specs[s] + " / " + colors[cIdx] + "・" + years[yIdx] + ")",
          price: calcPrice
        });
      }
    }
  }

  // 状態管理
  var currentCat = "すべて";
  var currentPage = 1;
  var perPage = 60;
  var cart = [];
  var discountRate = 0;
  var payMethod = "cash";

  var defaultCards = [
    { num: "3867588976571243", display: "3867 5889 7657 1243", name: "HINA SHIMIZU", cvv: "123" }
  ];

  function loadStorage(key, fallback) {
    try {
      var val = localStorage.getItem(key);
      return val ? JSON.parse(val) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function saveStorage(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  var registeredCards = loadStorage("joshin_cards_v2", defaultCards);
  var stats = loadStorage("joshin_stats_v2", { sales: 0, points: 0 });

  function updateStatsUI() {
    document.getElementById("totalPoints").textContent = stats.points.toLocaleString();
    document.getElementById("staffSales").textContent = stats.sales.toLocaleString();
    document.getElementById("staffPts").textContent = stats.points.toLocaleString();
  }

  // 初期UI構築
  function initUI() {
    var makerSel = document.getElementById("makerSelect");
    Object.keys(makersSet).sort().forEach(function(m) {
      var opt = document.createElement("option");
      opt.value = m;
      opt.textContent = m;
      makerSel.appendChild(opt);
    });

    var tabsEl = document.getElementById("catTabs");
    categories.forEach(function(c) {
      var btn = document.createElement("button");
      btn.className = "tab" + (c === currentCat ? " active" : "");
      btn.textContent = c;
      btn.onclick = function() {
        currentCat = c;
        currentPage = 1;
        var allTabs = tabsEl.querySelectorAll(".tab");
        for (var k = 0; k < allTabs.length; k++) allTabs[k].classList.remove("active");
        btn.classList.add("active");
        renderProducts();
      };
      tabsEl.appendChild(btn);
    });

    updateStatsUI();
    renderProducts();
  }

  function getFilteredProducts() {
    var kw = document.getElementById("searchInput").value.trim().toLowerCase();
    var mk = document.getElementById("makerSelect").value;
    return allProducts.filter(function(p) {
      if (currentCat !== "すべて" && p.cat !== currentCat) return false;
      if (mk && p.maker !== mk) return false;
      if (kw && p.name.toLowerCase().indexOf(kw) === -1) return false;
      return true;
    });
  }

  window.resetPageAndRender = function() {
    currentPage = 1;
    renderProducts();
  };

  window.changePage = function(delta) {
    var filtered = getFilteredProducts();
    var maxPage = Math.max(1, Math.ceil(filtered.length / perPage));
    currentPage = Math.min(maxPage, Math.max(1, currentPage + delta));
    renderProducts();
  };

  function renderProducts() {
    var filtered = getFilteredProducts();
    var maxPage = Math.max(1, Math.ceil(filtered.length / perPage));
    if (currentPage > maxPage) currentPage = maxPage;

    document.getElementById("itemCountBadge").textContent = filtered.length.toLocaleString() + "商品";
    document.getElementById("pageInfo").textContent = currentPage + " / " + maxPage + " ページ";

    var start = (currentPage - 1) * perPage;
    var slice = filtered.slice(start, start + perPage);
    var grid = document.getElementById("productGrid");
    grid.innerHTML = "";

    slice.forEach(function(p) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="c-maker">' + p.maker + '</div>' +
        '<div class="c-name">' + p.name + '</div>' +
        '<div class="c-price">' + p.price.toLocaleString() + '円</div>';
      card.onclick = function() { addToCart(p); };
      grid.appendChild(card);
    });
  }

  function addToCart(p) {
    playBeep(1046, 0.07, "square");
    var found = null;
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].id === p.id) { found = cart[i]; break; }
    }
    if (found) found.qty++;
    else cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
    renderCart();
  }

  window.modQty = function(id, delta) {
    playBeep(660, 0.05, "sine");
    for (var i = 0; i < cart.length; i++) {
      if (cart[i].id === id) {
        cart[i].qty += delta;
        if (cart[i].qty <= 0) cart.splice(i, 1);
        break;
      }
    }
    renderCart();
  };

  window.setDisc = function(rate, btn) {
    playBeep(784, 0.05, "sine");
    discountRate = rate;
    var btns = document.querySelectorAll(".disc-btn");
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
    btn.classList.add("active");
    renderCart();
  };

  function getTotals() {
    var sub = 0;
    var qty = 0;
    for (var i = 0; i < cart.length; i++) {
      sub += cart[i].price * cart[i].qty;
      qty += cart[i].qty;
    }
    var disc = Math.floor(sub * (discountRate / 100));
    return { sub: sub, disc: disc, total: sub - disc, qty: qty };
  }

  function renderCart() {
    var list = document.getElementById("cartList");
    list.innerHTML = "";
    cart.forEach(function(item) {
      var li = document.createElement("li");
      li.className = "cart-item";
      li.innerHTML =
        '<span style="flex:1; padding-right:4px;">' + item.name + '</span>' +
        '<span class="qty-btns">' +
          '<button onclick="modQty(' + item.id + ', -1)">-</button> ' +
          '<strong>' + item.qty + '</strong> ' +
          '<button onclick="modQty(' + item.id + ', 1)">+</button> ' +
          '<span style="display:inline-block; width:62px; text-align:right;">' + (item.price * item.qty).toLocaleString() + '円</span>' +
        '</span>';
      list.appendChild(li);
    });

    var t = getTotals();
    document.getElementById("totalQty").textContent = t.qty;
    document.getElementById("totalPrice").textContent = t.total.toLocaleString() + "円";
    calcChange();
  }

  window.switchPay = function(method) {
    playBeep(700, 0.05, "sine");
    payMethod = method;
    document.getElementById("tabCash").classList.toggle("active", method === "cash");
    document.getElementById("tabCard").classList.toggle("active", method === "card");
    document.getElementById("cashBox").style.display = method === "cash" ? "block" : "none";
    document.getElementById("cardBox").style.display = method === "card" ? "block" : "none";
  };

  window.setExact = function() {
    document.getElementById("depositInput").value = getTotals().total;
    calcChange();
  };

  window.addCash = function(amt) {
    var el = document.getElementById("depositInput");
    el.value = (parseInt(el.value, 10) || 0) + amt;
    calcChange();
  };

  window.calcChange = function() {
    var total = getTotals().total;
    var dep = parseInt(document.getElementById("depositInput").value, 10);
    var chEl = document.getElementById("changePrice");
    if (isNaN(dep)) {
      chEl.textContent = "0円";
      chEl.style.color = "#059669";
      return;
    }
    var diff = dep - total;
    if (diff >= 0) {
      chEl.textContent = diff.toLocaleString() + "円";
      chEl.style.color = "#059669";
    } else {
      chEl.textContent = "不足 " + Math.abs(diff).toLocaleString() + "円";
      chEl.style.color = "#dc2626";
    }
  };

  window.fillDefaultCard = function() {
    if (registeredCards.length > 0) {
      document.getElementById("ccNumInput").value = registeredCards[0].display;
      document.getElementById("ccCvvInput").value = registeredCards[0].cvv;
    }
  };

  window.clearCardInput = function() {
    document.getElementById("ccNumInput").value = "";
    document.getElementById("ccCvvInput").value = "";
  };

  window.clearCart = function() {
    playBeep(440, 0.08, "sine");
    cart = [];
    document.getElementById("depositInput").value = "";
    renderCart();
  };

  window.checkout = function() {
    var t = getTotals();
    if (t.qty === 0) return alert("商品が選択されていません");

    var payDetail = "";
    if (payMethod === "cash") {
      var dep = parseInt(document.getElementById("depositInput").value, 10);
      if (isNaN(dep) || dep < t.total) {
        playBeep(220, 0.25, "sawtooth");
        return alert("お預かり金額が不足しています");
      }
      payDetail = "支払い方法: 現金払い\nお預かり: " + dep.toLocaleString() + "円\nお釣り: " + (dep - t.total).toLocaleString() + "円";
    } else {
      var rawNum = document.getElementById("ccNumInput").value.replace(/\s+/g, "").replace(/-/g, "");
      var rawCvv = document.getElementById("ccCvvInput").value.trim();
      var matched = null;
      for (var i = 0; i < registeredCards.length; i++) {
        if (registeredCards[i].num === rawNum && registeredCards[i].cvv === rawCvv) {
          matched = registeredCards[i];
          break;
        }
      }
      if (!matched) {
        playBeep(180, 0.35, "sawtooth");
        return alert("カード番号またはセキュリティコードが登録情報と一致しません。\n（⚙️ 店員設定で登録確認ができます）");
      }
      var authNo = Math.floor(100000 + Math.random() * 900000);
      var payType = document.getElementById("ccPayType").value;
      payDetail =
        "支払い方法: クレジット (" + payType + ")\n" +
        "カード番号: **** **** **** " + rawNum.slice(-4) + "\n" +
        "名義人: " + matched.name + "\n" +
        "承認番号: " + authNo;
    }

    // 決済音（チャリーン♪）
    playBeep(1318, 0.1, "sine");
    setTimeout(function() { playBeep(1568, 0.25, "sine"); }, 110);

    // 毎回 +10ポイント付与
    stats.sales += t.total;
    stats.points += 10;
    saveStorage("joshin_stats_v2", stats);
    updateStatsUI();

    var now = new Date().toLocaleString("ja-JP");
    var lines = ["Joshin お買い上げ明細", now, "----------------------------"];
    cart.forEach(function(item) {
      lines.push(item.name);
      lines.push("  " + item.qty + "点 × " + item.price.toLocaleString() + "円 = " + (item.qty * item.price).toLocaleString() + "円");
    });
    lines.push("----------------------------");
    if (t.disc > 0) lines.push("割引 (" + discountRate + "%OFF): -" + t.disc.toLocaleString() + "円");
    lines.push("合計金額: " + t.total.toLocaleString() + "円");
    lines.push(payDetail);
    lines.push("----------------------------");
    lines.push("今回獲得ポイント: +10 P");
    lines.push("累計ポイント残高: " + stats.points.toLocaleString() + " P");

    document.getElementById("receiptContent").innerText = lines.join("\n");
    document.getElementById("receiptModal").classList.add("open");

    cart = [];
    document.getElementById("depositInput").value = "";
    renderCart();
  };

  window.closeModal = function(id) {
    document.getElementById(id).classList.remove("open");
  };

  window.openStaffModal = function() {
    document.getElementById("staffPinInput").value = "";
    document.getElementById("staffLockBox").style.display = "block";
    document.getElementById("staffContentBox").style.display = "none";
    document.getElementById("staffModal").classList.add("open");
  };

  window.unlockStaff = function() {
    if (document.getElementById("staffPinInput").value === "0000") {
      playBeep(987, 0.1, "sine");
      document.getElementById("staffLockBox").style.display = "none";
      document.getElementById("staffContentBox").style.display = "block";
      renderRegisteredCards();
    } else {
      playBeep(200, 0.25, "sawtooth");
      alert("暗証番号が違います（初期設定は 0000 です）");
    }
  };

  function renderRegisteredCards() {
    var box = document.getElementById("registeredCardList");
    box.innerHTML = "";
    registeredCards.forEach(function(c, idx) {
      var div = document.createElement("div");
      div.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:4px 6px; border:1px solid #e2e8f0; border-radius:4px; margin-bottom:4px; font-size:11px;";
      div.innerHTML =
        '<div><strong>' + c.display + '</strong><br>' + c.name + ' / CVV:' + c.cvv + '</div>' +
        '<button onclick="deleteCard(' + idx + ')" style="background:#ef4444; color:#fff; border:none; border-radius:4px; padding:2px 6px; font-size:10px; cursor:pointer;">削除</button>';
      box.appendChild(div);
    });
  }

  window.registerNewCard = function() {
    var raw = document.getElementById("regCcNum").value.replace(/\s+/g, "").replace(/-/g, "");
    var name = document.getElementById("regCcName").value.trim().toUpperCase();
    var cvv = document.getElementById("regCcCvv").value.trim();
    if (!/^\d{16}$/.test(raw)) return alert("カード番号は16桁の数字で入力してください");
    if (!name) return alert("名義人（ローマ字）を入力してください");
    if (!/^\d{3,4}$/.test(cvv)) return alert("セキュリティコード（3〜4桁）を入力してください");

    var disp = raw.replace(/(\d{4})(?=\d)/g, "$1 ");
    registeredCards.push({ num: raw, display: disp, name: name, cvv: cvv });
    saveStorage("joshin_cards_v2", registeredCards);
    document.getElementById("regCcNum").value = "";
    document.getElementById("regCcName").value = "";
    document.getElementById("regCcCvv").value = "";
    playBeep(1046, 0.1, "sine");
    renderRegisteredCards();
  };

  window.deleteCard = function(idx) {
    registeredCards.splice(idx, 1);
    saveStorage("joshin_cards_v2", registeredCards);
    renderRegisteredCards();
  };

  window.resetAllData = function() {
    if (confirm("売上累計と累計ポイントを0にリセットしますか？")) {
      stats = { sales: 0, points: 0 };
      saveStorage("joshin_stats_v2", stats);
      updateStatsUI();
    }
  };

  initUI();
})();
</script>
</body>
</html>
