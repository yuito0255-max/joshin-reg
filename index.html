<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Joshin POSレジシステム（全12,000商品・コンパクト版）</title>
  <style>
    :root {
      --primary: #d90429;
      --primary-dark: #b00020;
      --blue: #005bab;
      --bg: #eef2f6;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --green: #059669;
      --gold: #d97706;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    /* コンパクトヘッダー */
    header {
      height: 44px;
      background: linear-gradient(90deg, var(--primary) 0%, #ef233c 100%);
      color: #fff;
      padding: 0 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .header-left { display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .header-title { font-weight: 800; font-size: 14px; white-space: nowrap; }
    .badge {
      background: rgba(255,255,255,0.22);
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
      white-space: nowrap;
    }
    .header-actions { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
    .h-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.45);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .h-btn.staff { background: #1e293b; border-color: #475569; }

    /* メインレイアウト（1画面にピタッと収める） */
    .main-wrap {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 8px;
      padding: 8px;
      height: calc(100vh - 44px);
      height: calc(100dvh - 44px);
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 720px) {
      html, body { overflow: auto; height: auto; }
      .main-wrap { grid-template-columns: 1fr; height: auto; }
    }

    .panel {
      background: var(--card);
      border-radius: 8px;
      padding: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* 検索・フィルター（省スペース） */
    .search-row { display: flex; gap: 4px; margin-bottom: 5px; }
    .search-input {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      min-width: 0;
    }
    .clear-search {
      padding: 0 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .tabs-scroll {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 4px;
      scrollbar-width: none;
      flex-shrink: 0;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .maker-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .grid-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .page-nav { display: flex; gap: 4px; align-items: center; }
    .page-nav button {
      padding: 2px 6px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 4px;
      font-size: 10px;
      cursor: pointer;
    }

    /* 商品グリッド（コンパクトカード） */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 5px;
      overflow-y: auto;
      flex: 1;
      padding-right: 2px;
      align-content: start;
    }
    .p-card {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px;
      background: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 64px;
    }
    .p-card:active { transform: scale(0.97); background: #eff6ff; border-color: var(--blue); }
    .p-maker {
      font-size: 9px;
      font-weight: bold;
      color: var(--blue);
      background: #eff6ff;
      padding: 1px 4px;
      border-radius: 3px;
      align-self: flex-start;
      margin-bottom: 2px;
    }
    .p-name {
      font-size: 11px;
      font-weight: bold;
      line-height: 1.2;
      margin-bottom: 3px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .p-price { font-size: 12px; font-weight: 800; color: var(--primary); text-align: right; }

    /* 右側：お会計パネル（スッキリ収納） */
    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .cart-header h2 { margin: 0; font-size: 13px; }
    .cart-list {
      list-style: none;
      padding: 0;
      margin: 0 0 6px 0;
      flex: 1;
      overflow-y: auto;
      min-height: 60px;
      border: 1px solid #f1f5f9;
      border-radius: 6px;
      padding: 4px;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
      border-bottom: 1px dashed #e2e8f0;
      font-size: 11px;
      gap: 4px;
    }
    .cart-item-name { flex: 1; font-weight: bold; line-height: 1.2; }
    .qty-controls { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
    .q-btn {
      width: 22px;
      height: 22px;
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }
    .q-btn.del { background: #fee2e2; color: #dc2626; border-color: #fecaca; }

    /* 割引＆合計ボックス */
    .discount-row {
      display: flex;
      gap: 3px;
      margin-bottom: 5px;
      flex-shrink: 0;
    }
    .disc-btn {
      flex: 1;
      padding: 3px 0;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .disc-btn.active { background: #fef3c7; border-color: var(--gold); color: #b45309; }

    .summary-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .sum-line { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 2px; }
    .total-line { display: flex; justify-content: space-between; align-items: baseline; margin-top: 2px; padding-top: 3px; border-top: 1px solid #cbd5e1; }
    .total-val { font-size: 18px; font-weight: 900; color: var(--primary); }
    .pt-badge { font-size: 10px; font-weight: bold; color: var(--gold); background: #fef3c7; padding: 1px 6px; border-radius: 8px; }

    /* 支払いタブ切り替え */
    .pay-tabs { display: flex; gap: 4px; margin-bottom: 5px; flex-shrink: 0; }
    .pay-tab {
      flex: 1;
      padding: 5px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      border-radius: 6px;
      font-weight: bold;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .pay-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    .pay-area { flex-shrink: 0; }
    .cash-row { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
    .cash-input {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid var(--blue);
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      text-align: right;
      min-width: 0;
    }
    .quick-btns { display: flex; gap: 3px; margin-bottom: 5px; }
    .q-cash {
      flex: 1;
      padding: 4px 2px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    /* クレジット入力コンパクト */
    .cc-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 5px;
    }
    .cc-row { display: flex; gap: 4px; margin-bottom: 4px; }
    .cc-input {
      padding: 5px 6px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      font-weight: bold;
      min-width: 0;
    }
    .cc-num { flex: 2.3; }
    .cc-cvv { flex: 0.7; text-align: center; }
    .cc-sub { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
    .cc-select { padding: 3px; border-radius: 4px; border: 1px solid var(--border); font-size: 10px; }
    .cc-mini-btn { padding: 3px 6px; font-size: 10px; border: 1px solid var(--border); background: #fff; border-radius: 4px; cursor: pointer; }
    .cc-err { color: #dc2626; font-size: 10px; font-weight: bold; margin-top: 3px; display: none; }

    .checkout-btn {
      width: 100%;
      padding: 8px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }
    .checkout-btn:active { opacity: 0.9; }

    /* モーダル共通 */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }
    .modal-card {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; margin-bottom: 10px; }
    .modal-head h3 { margin: 0; font-size: 14px; }
    .close-m { background: #f1f5f9; border: none; border-radius: 6px; padding: 4px 8px; font-weight: bold; cursor: pointer; }
    .form-grp { margin-bottom: 8px; }
    .form-grp label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 2px; }
    .form-grp input { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
    .saved-card-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      margin-bottom: 5px;
      font-size: 11px;
      background: #f8fafc;
    }
    .receipt-paper {
      font-family: monospace;
      background: #fff;
      border: 1px dashed #94a3b8;
      padding: 10px;
      font-size: 11px;
      line-height: 1.45;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-title">Joshin POSレジ</span>
    <span class="badge">全12,000商品</span>
    <span class="badge" style="background:#fef3c7;color:#92400e;">累計 <span id="totalPointsBadge">0</span>P</span>
  </div>
  <div class="header-actions">
    <button class="h-btn" id="soundToggle" onclick="toggleSound()">🔊 ON</button>
    <button class="h-btn staff" onclick="openStaffModal()">⚙️ 店員設定</button>
  </div>
</header>

<div class="main-wrap">
  <!-- 左側：商品一覧 -->
  <div class="panel">
    <div class="search-row">
      <input type="text" id="searchInput" class="search-input" placeholder="商品名・メーカー検索（例：MacBook, 冷蔵庫, Switch）" oninput="applyFilters()">
      <button class="clear-search" onclick="resetSearch()">クリア</button>
    </div>

    <div class="tabs-scroll" id="catTabs"></div>
    <div class="tabs-scroll" id="makerTabs"></div>

    <div class="grid-meta">
      <span id="hitCount">該当: 12,000件</span>
      <div class="page-nav">
        <button onclick="changePage(-1)">◀ 前</button>
        <span id="pageInfo">1 / 120</span>
        <button onclick="changePage(1)">次 ▶</button>
      </div>
    </div>

    <div class="product-grid" id="productGrid"></div>
  </div>

  <!-- 右側：お会計パネル -->
  <div class="panel">
    <div class="cart-header">
      <h2>🧾 お会計（<span id="cartCount">0</span>点）</h2>
      <button onclick="clearCart()" style="font-size:10px;padding:2px 6px;border:1px solid #cbd5e1;background:#fff;border-radius:4px;cursor:pointer;">全クリア</button>
    </div>

    <ul class="cart-list" id="cartList">
      <li style="text-align:center;color:#94a3b8;padding:16px 0;font-size:11px;">左の商品タップで追加</li>
    </ul>

    <div class="discount-row">
      <button class="disc-btn active" onclick="setDiscount(0, this)">割引なし</button>
      <button class="disc-btn" onclick="setDiscount(5, this)">5%OFF</button>
      <button class="disc-btn" onclick="setDiscount(10, this)">10%OFF</button>
      <button class="disc-btn" onclick="setDiscount(20, this)">20%OFF</button>
    </div>

    <div class="summary-box">
      <div class="sum-line">
        <span>小計 / 割引</span>
        <span><span id="subTotal">0</span>円 / -<span id="discAmount">0</span>円</span>
      </div>
      <div class="total-line">
        <div>
          <span style="font-weight:bold;font-size:12px;">合計</span>
          <span class="pt-badge">今回 +10 P</span>
        </div>
        <span class="total-val"><span id="grandTotal">0</span>円</span>
      </div>
    </div>

    <div class="pay-tabs">
      <div class="pay-tab active" id="tabCash" onclick="switchPayMode('cash')">💴 現金払い</div>
      <div class="pay-tab" id="tabCard" onclick="switchPayMode('card')">💳 クレジット</div>
    </div>

    <!-- 現金払いエリア -->
    <div class="pay-area" id="cashArea">
      <div class="cash-row">
        <span style="font-size:11px;font-weight:bold;white-space:nowrap;">お預かり</span>
        <input type="number" id="depositInput" class="cash-input" placeholder="0" oninput="calcChange()">
        <span style="font-size:11px;font-weight:bold;white-space:nowrap;color:var(--green);">釣:<span id="changeVal">0</span>円</span>
      </div>
      <div class="quick-btns">
        <button class="q-cash" onclick="setExactCash()">ちょうど</button>
        <button class="q-cash" onclick="addCash(1000)">+1千</button>
        <button class="q-cash" onclick="addCash(5000)">+5千</button>
        <button class="q-cash" onclick="addCash(10000)">+1万</button>
      </div>
      <button class="checkout-btn" onclick="checkoutCash()">💴 現金でお会計完了</button>
    </div>

    <!-- クレジット払いエリア -->
    <div class="pay-area" id="cardArea" style="display:none;">
      <div class="cc-box">
        <div class="cc-row">
          <input type="text" id="ccNumInput" class="cc-input cc-num" placeholder="カード番号 16桁" maxlength="19" oninput="formatCCInput(this)">
          <input type="text" id="ccCvvInput" class="cc-input cc-cvv" placeholder="裏3桁" maxlength="4">
        </div>
        <div class="cc-sub">
          <select id="ccPayType" class="cc-select">
            <option value="一括払い">一括払い</option>
            <option value="2回払い">2回払い</option>
            <option value="ボーナス一括">ボーナス一括</option>
          </select>
          <div>
            <button class="cc-mini-btn" onclick="autoFillFirstCard()">登録カード入力</button>
            <button class="cc-mini-btn" onclick="clearCCInput()">消去</button>
          </div>
        </div>
        <div class="cc-err" id="ccErrorMsg"></div>
      </div>
      <button class="checkout-btn" style="background:var(--blue);" onclick="checkoutCard()">💳 カード認証してお会計</button>
    </div>
  </div>
</div>

<!-- 店員設定モーダル -->
<div class="modal-bg" id="staffModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>⚙️ 店員設定（クレジットカード登録）</h3>
      <button class="close-m" onclick="closeStaffModal()">閉じる</button>
    </div>

    <div id="staffLockView">
      <p style="font-size:11px;color:#475569;margin-top:0;">店員用暗証番号を入力してください（初期値: <b>0000</b>）</p>
      <div class="form-grp">
        <input type="password" id="staffPinInput" placeholder="暗証番号 4桁" maxlength="8" style="text-align:center;font-size:16px;letter-spacing:4px;">
      </div>
      <button class="checkout-btn" style="background:#1e293b;" onclick="unlockStaff()">ロック解除</button>
    </div>

    <div id="staffMainView" style="display:none;">
      <div style="background:#f1f5f9;padding:8px;border-radius:6px;margin-bottom:10px;font-size:11px;">
        <div>本日の売上累計: <b id="staffSalesTotal">0</b>円（<span id="staffSalesCount">0</span>件）</div>
        <div>累計付与ポイント: <b id="staffPointsTotal">0</b> P（毎回 +10 P）</div>
      </div>

      <h4 style="margin:0 0 6px 0;font-size:12px;">➕ 新しいクレジットカードを登録</h4>
      <div class="form-grp">
        <label>カード番号（16桁）</label>
        <input type="text" id="regCardNum" placeholder="例: 3867 5889 7657 1243" maxlength="19" oninput="formatCCInput(this)">
      </div>
      <div class="form-grp">
        <label>カード名義人（ローマ字）</label>
        <input type="text" id="regCardName" placeholder="例: HINA SHIMIZU">
      </div>
      <div class="form-grp">
        <label>セキュリティコード（裏面3桁）</label>
        <input type="text" id="regCardCvv" placeholder="例: 123" maxlength="4">
      </div>
      <button class="checkout-btn" style="background:var(--blue);margin-bottom:12px;" onclick="registerNewCard()">このカードをレジに登録</button>

      <h4 style="margin:0 0 6px 0;font-size:12px;">📋 登録済みカード一覧</h4>
      <div id="savedCardsList"></div>
    </div>
  </div>
</div>

<!-- レシートモーダル -->
<div class="modal-bg" id="receiptModal">
  <div class="modal-card" style="max-width:340px;">
    <div class="modal-head">
      <h3>🧾 お買い上げレシート</h3>
      <button class="close-m" onclick="closeReceiptModal()">完了</button>
    </div>
    <div class="receipt-paper" id="receiptContent"></div>
    <button class="checkout-btn" style="margin-top:8px;" onclick="closeReceiptModal()">次の会計へ</button>
  </div>
</div>

<script>
  // 効果音（Web Audio API）
  let soundOn = true;
  let audioCtx = null;
  function playBeep(type) {
    if (!soundOn) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      if (type === 'scan') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1760, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'cash') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(1046.5, now);
        osc.frequency.setValueAtTime(1567.98, now + 0.09);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
      }
    } catch (e) {}
  }

  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById('soundToggle').textContent = soundOn ? '🔊 ON' : '🔇 OFF';
  }

  // 全12,000商品データの高速生成

  function applyFilters() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();

      if (currentCat !== 'すべて' && p.cat !== currentCat) return false;
      if (currentMaker !== 'すべて' && p.maker !== currentMaker) return false;
      if (q && !p.name.toLowerCase().includes(q) && !p.maker.toLowerCase().includes(q)) return false;
      return true;
    });
    currentPage = 1;
    renderProducts();
  }

  function changePage(delta) {
    const maxPage = Math.max(1, Math.ceil(filteredProducts.length / PAGE_SIZE));
    currentPage = Math.min(maxPage, Math.max(1, currentPage + delta));
    renderProducts();
  }

  function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';
    const maxPage = Math.max(1, Math.ceil(filteredProducts.length / PAGE_SIZE));
    document.getElementById('hitCount').textContent = `該当: ${filteredProducts.length.toLocaleString()}件`;
    document.getElementById('pageInfo').textContent = `${currentPage} / ${maxPage}`;

    const start = (currentPage - 1) * PAGE_SIZE;
    const slice = filteredProducts.slice(start, start + PAGE_SIZE);
    const frag = document.createDocumentFragment();
    slice.forEach(p => {
      const card = document.createElement('div');
      card.className = 'p-card';
      card.innerHTML = `
        <span class="p-maker">${p.maker}</span>
        <div class="p-name">${p.name}</div>
        <div class="p-price">${p.price.toLocaleString()}円</div>

      card.onclick = () => addToCart(p);
      frag.appendChild(card);
    });
    grid.appendChild(frag);
  }

  // カート操作
  function addToCart(product) {
    playBeep('scan');
    const found = cart.find(i => i.id === product.id);
    if (found) {
      found.qty++;
    } else {
      cart.push({ ...product, qty: 1 });
    }
    renderCart();
  }

  function updateQty(id, delta) {
    playBeep('scan');
    const idx = cart.findIndex(i => i.id === id);
    if (idx === -1) return;
    cart[idx].qty += delta;
    if (cart[idx].qty <= 0) cart.splice(idx, 1);
    renderCart();
  }

  function clearCart() {
    cart = [];
    document.getElementById('depositInput').value = '';
    renderCart();
  }

  function setDiscount(rate, btn) {
    discountRate = rate;
    document.querySelectorAll('.disc-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCart();
  }

  function getTotals() {
    const sub = cart.reduce((s, i) => s + i.price * i.qty, 0);
    const disc = Math.floor(sub * (discountRate / 100));
    const grand = sub - disc;
    const qty = cart.reduce((s, i) => s + i.qty, 0);
    return { sub, disc, grand, qty };
  }

  function renderCart() {
    const list = document.getElementById('cartList');
    const { sub, disc, grand, qty } = getTotals();
    document.getElementById('cartCount').textContent = qty;
    document.getElementById('subTotal').textContent = sub.toLocaleString();
    document.getElementById('discAmount').textContent = disc.toLocaleString();
    document.getElementById('grandTotal').textContent = grand.toLocaleString();

    if (cart.length === 0) {
      list.innerHTML = '<li style="text-align:center;color:#94a3b8;padding:16px 0;font-size:11px;">左の商品タップで追加</li>';
    } else {
      list.innerHTML = '';
      cart.forEach(item => {
        const li = document.createElement('li');
        li.className = 'cart-item';
        li.innerHTML = `
          <div class="cart-item-name">${item.name}<br><span style="color:#64748b;font-weight:normal;">@${item.price.toLocaleString()}円 × ${item.qty}</span></div>
          <div class="qty-controls">
            <button class="q-btn" onclick="updateQty(${item.id}, -1)">-</button>
            <span style="min-width:16px;text-align:center;font-weight:bold;">${item.qty}</span>
            <button class="q-btn" onclick="updateQty(${item.id}, 1)">+</button>
            <button class="q-btn del" onclick="updateQty(${item.id}, -999)">×</button>
          </div>
        `;
        list.appendChild(li);
      });
    }
    calcChange();
  }

    document.getElementById('tabCard').classList.toggle('active', mode === 'card');
    document.getElementById('cashArea').style.display = mode === 'cash' ? 'block' : 'none';

    document.getElementById('ccErrorMsg').style.display = 'none';

  // 現金計算
  function setExactCash() {
    const { grand } = getTotals();
    document.getElementById('depositInput').value = grand;
    calcChange();
  }

  function addCash(amt) {
    const cur = parseInt(document.getElementById('depositInput').value, 10) || 0;
    document.getElementById('depositInput').value = cur + amt;
    calcChange();
  }

  function calcChange() {
    const { grand } = getTotals();
    const dep = parseInt(document.getElementById('depositInput').value, 10) || 0;
    const diff = dep - grand;
    const el = document.getElementById('changeVal');
    if (dep === 0) {
      el.textContent = '0';
      el.style.color = 'var(--green)';
    } else if (diff >= 0) {
      el.textContent = diff.toLocaleString();
      el.style.color = 'var(--green)';
    } else {
      el.textContent = `不足 ${Math.abs(diff).toLocaleString()}`;
      el.style.color = 'var(--primary)';
    }
  }

  function checkoutCash() {
    const { grand } = getTotals();
    if (grand === 0) return alert('カートに商品がありません');
    const dep = parseInt(document.getElementById('depositInput').value, 10) || 0;
    if (dep < grand) {
      playBeep('error');
      return alert('お預かり金額が不足しています');
    }
    const change = dep - grand;
    completeSale('現金払い', `お預かり: ${dep.toLocaleString()}円 / お釣り: ${change.toLocaleString()}円`);
  }

  function checkoutCard() {
    const { grand } = getTotals();

    const rawNum = document.getElementById('ccNumInput').value.replace(/\D/g, '');
    const rawCvv = document.getElementById('ccCvvInput').value.trim();

      `カード番号: **** **** **** ${last4}

承認番号: ${authCode}`

  }

    if (num.length !== 16) return alert('カード番号は16桁の数字で入力してください');
    if (!name) return alert('カード名義人（ローマ字）を入力してください');
    if (cvv.length < 3) return alert('セキュリティコード（3桁）を入力してください');

    const formatted = num.replace(/(.{4})/g, '$1 ').trim();
    savedCards.push({ number: num, formatted, name, cvv });
    savePersistent();
    playBeep('cash');

    document.getElementById('regCardNum').value = '';
    document.getElementById('regCardName').value = '';
    document.getElementById('regCardCvv').value = '';
    updateStaffView();
    alert('新しいクレジットカードを登録しました！');
  }

  function deleteSavedCard(idx) {
    if (savedCards.length <= 1) return alert('最低1枚はカードを残す必要があります');
    if (confirm('この登録カードを削除しますか？')) {
      savedCards.splice(idx, 1);
      savePersistent();
      updateStaffView();
    }
  }

  // 初期化実行
  initTabs();
  renderProducts();
  savePersistent();
</script>
</body>
</html>
