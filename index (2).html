<!DOCTYPE html>
<html lang="ja">
<head>

<title>家電・PC・ホビー POSレジ</title>
<style>

    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;

  .h-btn {
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
    color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem;
    font-weight: bold; cursor: pointer;
  }
  .main-wrap {
    display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px;
    padding: 12px; flex: 1; overflow: hidden;
  }
  @media (max-width: 768px) {
    body { height: auto; overflow: auto; }
    .main-wrap { grid-template-columns: 1fr; overflow: visible; }
  }
  .left-panel, .right-panel {
    background: white; border-radius: 12px; padding: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden;
  }
  .search-box {
    width: 100%; padding: 10px 12px; border: 2px solid #cbd5e1; border-radius: 8px;
    font-size: 0.95rem; margin-bottom: 10px; flex-shrink: 0;
  }
  .search-box:focus { outline: none; border-color: #d90429; }
  .cat-tabs {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px;
    margin-bottom: 8px; border-bottom: 1px solid #e2e8f0; flex-shrink: 0;
  }
  .cat-tab {
    background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 20px;
    padding: 6px 12px; font-size: 0.8rem; font-weight: bold; white-space: nowrap;
    cursor: pointer; color: #334155;
  }
  .cat-tab.active { background: #d90429; color: white; border-color: #d90429; }
  .product-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 8px; overflow-y: auto; padding-right: 4px; flex: 1; align-content: start;
  }
  .p-card {
    background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 10px 8px; text-align: left; cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: transform 0.05s, background 0.1s;
  }
  .p-card:active { transform: scale(0.97); background: #fee2e2; border-color: #fca5a5; }
  .p-maker { font-size: 0.7rem; color: #64748b; font-weight: bold; margin-bottom: 2px; }
  .p-name { font-size: 0.85rem; font-weight: bold; color: #0f172a; line-height: 1.25; margin-bottom: 6px; }
  .p-price { font-size: 0.95rem; font-weight: bold; color: #d90429; text-align: right; }
  .custom-add {
    display: flex; gap: 4px; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid #e2e8f0; flex-shrink: 0;
  }
  .custom-add input {
    padding: 7px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.8rem; min-width: 0;
  }
  .custom-add button {
    background: #0284c7; color: white; border: none; border-radius: 6px;
    padding: 0 12px; font-weight: bold; font-size: 0.8rem; white-space: nowrap; cursor: pointer;
  }
  .cart-header {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 8px; border-bottom: 2px solid #f1f5f9; font-weight: bold; flex-shrink: 0;
  }
  .cart-list {
    flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 0;
  }
  .cart-empty { text-align: center; color: #94a3b8; margin-top: 40px; font-size: 0.9rem; }
  .cart-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 4px; border-bottom: 1px solid #f1f5f9; gap: 6px;
  }
  .ci-info { flex: 1; min-width: 0; }
  .ci-name { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ci-sub { font-size: 0.75rem; color: #64748b; }
  .ci-ctrl { display: flex; align-items: center; gap: 4px; }
  .qty-btn {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid #cbd5e1;
    background: #f8fafc; font-weight: bold; cursor: pointer;
  }
  .del-btn {
    background: #fee2e2; color: #dc2626; border: none; border-radius: 6px;
    padding: 4px 7px; font-size: 0.75rem; font-weight: bold; cursor: pointer; margin-left: 2px;

  .calc-area {
    background: #f8fafc; border-radius: 10px; padding: 10px; margin-top: 8px; flex-shrink: 0;

    flex: 1; padding: 6px 2px; border: 1px solid #cbd5e1; background: white;
    border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer;

    border: 1px solid #bae6fd; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer;

  .action-row { display: flex; gap: 8px; margin-top: 8px; }

  }

</style>

    <button class="h-btn" onclick="resetCatalog()">🔄 商品初期化</button>

    <div class="product-grid" id="productGrid"></div>
    <div class="custom-add">
      <input type="text" id="addMaker" placeholder="メーカー" style="width: 75px;">
      <input type="text" id="addName" placeholder="自由入力の商品名" style="flex: 1;">
      <input type="number" id="addPrice" placeholder="税込価格" style="width: 85px;">
      <button onclick="addCustomProduct()">+ 登録</button>
    </div>
  </div>

  <div class="right-panel">
    <div class="cart-header">
      <span>🧾 お買上明細</span>
      <span id="itemCount">0点</span>
    </div>
    <ul class="cart-list" id="cartList">
      <li class="cart-empty">左の商品をタップして追加してください</li>
    </ul>

    <div class="calc-area">
      <div class="disc-row">
        <button class="disc-btn active" id="d0" onclick="setDiscount(0)">割引なし</button>
        <button class="disc-btn" id="d5" onclick="setDiscount(5)">5%OFF</button>
        <button class="disc-btn" id="d10" onclick="setDiscount(10)">10%OFF</button>
        <button class="disc-btn" id="d20" onclick="setDiscount(20)">20%OFF</button>
      </div>
      <div class="sum-row">
        <span>合計 (税込)</span>
        <span class="pt-badge" id="pointBadge">+0 pt 還元</span>
        <span class="total-val" id="totalDisplay">0 円</span>
      </div>
      <div class="sum-row">
        <span>お預かり</span>
        <input type="number" id="depositInput" class="dep-input" placeholder="0" oninput="updateSummary()">
      </div>
      <div class="quick-cash">
        <button class="qc-btn" onclick="setExactCash()">ちょうど</button>
        <button class="qc-btn" onclick="addCash(1000)">+1,000円</button>
        <button class="qc-btn" onclick="addCash(5000)">+5,000円</button>
        <button class="qc-btn" onclick="addCash(10000)">+1万円</button>
        <button class="qc-btn" onclick="clearCash()">クリア</button>
      </div>
      <div class="sum-row" style="margin-bottom:0;">
        <span>お釣り</span>
        <span class="change-val" id="changeDisplay">0 円</span>
      </div>
      <div class="action-row">
        <button class="clear-btn" onclick="clearCart()">取消</button>
        <button class="pay-btn" onclick="completeCheckout()">会計完了</button>
      </div>
      <div class="sales-bar">
        <span>本日売上: <strong id="salesTotal">0</strong>円 (<span id="salesCount">0</span>件)</span>
        <button onclick="resetSales()" style="border:1px solid #cbd5e1; background:white; border-radius:4px; padding:2px 6px; font-size:0.7rem; cursor:pointer;">売上リセット</button>
      </div>
    </div>
  </div>
</div>

  } else {

} catch (e) {

}

let currentCat = "すべて";
let cart = [];

let soundOn = true;
let audioCtx = null;
let sales = { total: 0, count: 0 };

try {
  const s = JSON.parse(localStorage.getItem('joshin_sales_v9'));
  if (s && typeof s.total === 'number') sales = s;
} catch (e) {}

function playTone(type) {
  if (!soundOn) return;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'scan') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1950, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'tap') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(700, now);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'cash') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1046.5, now);
      osc.frequency.setValueAtTime(1318.5, now + 0.09);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    }
  } catch (e) {}
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundToggle').textContent = soundOn ? '🔊 音: ON' : '🔇 音: OFF';
  if (soundOn) playTone('tap');
}

function renderTabs() {
  const cats = ["すべて", "パソコン・タブレット", "PC周辺機器・スマホ", "テレビ・カメラ・音", "冷蔵庫・洗濯機・空調", "キッチン・掃除・美容", "ゲーム・ホビー・日用品"];
  const wrap = document.getElementById('catTabs');
  wrap.innerHTML = '';
  cats.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (currentCat === c ? ' active' : '');
    btn.textContent = c;
    btn.onclick = () => {
      currentCat = c;
      playTone('tap');
      renderTabs();
      renderProducts();
    };
    wrap.appendChild(btn);
  });
}

function renderProducts() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';

  const filtered = products.filter(p => {
    const matchCat = (currentCat === "すべて") || (p.cat === currentCat);
    const text = (p.maker + " " + p.name).toLowerCase();
    const matchKw = !kw || text.includes(kw);
    return matchCat && matchKw;
  });

  if (filtered.length === 0) {
    const emptyDiv = document.createElement('div');
    emptyDiv.style.gridColumn = '1 / -1';
    emptyDiv.style.textAlign = 'center';
    emptyDiv.style.color = '#94a3b8';
    emptyDiv.style.padding = '24px';
    emptyDiv.textContent = '該当する商品が見つかりません';
    grid.appendChild(emptyDiv);
    return;
  }

  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'p-card';
    card.onclick = () => addToCart(p);

    const mDiv = document.createElement('div');
    mDiv.className = 'p-maker';
    mDiv.textContent = p.maker;

    const nDiv = document.createElement('div');
    nDiv.className = 'p-name';
    nDiv.textContent = p.name;

    const prDiv = document.createElement('div');
    prDiv.className = 'p-price';
    prDiv.textContent = p.price.toLocaleString() + '円';

    card.appendChild(mDiv);
    card.appendChild(nDiv);
    card.appendChild(prDiv);
    grid.appendChild(card);
  });
}

function addCustomProduct() {
  const maker = document.getElementById('addMaker').value.trim() || 'その他';
  const name = document.getElementById('addName').value.trim();
  const price = parseInt(document.getElementById('addPrice').value, 10);
  if (!name || isNaN(price) || price < 0) {
    alert('商品名と正しい価格を入力してください');
    return;
  }
  const newItem = {
    id: Date.now(),
    cat: currentCat === "すべて" ? "パソコン・タブレット" : currentCat,
    maker: maker,
    name: name,
    price: price
  };
  products.unshift(newItem);
  try { localStorage.setItem('joshin_pos_v9', JSON.stringify(products)); } catch (e) {}
  document.getElementById('addMaker').value = '';
  document.getElementById('addName').value = '';
  document.getElementById('addPrice').value = '';
  playTone('scan');
  renderProducts();
}

function resetCatalog() {
  if (!confirm('商品リストを初期状態（パソコン・全家電リスト）に戻しますか？')) return;
  products = DEFAULT_ITEMS.slice();
  try { localStorage.setItem('joshin_pos_v9', JSON.stringify(products)); } catch (e) {}
  currentCat = "すべて";
  document.getElementById('searchInput').value = '';
  playTone('tap');
  renderTabs();
  renderProducts();
}

function addToCart(p) {
  playTone('scan');
  const found = cart.find(item => item.id === p.id);
  if (found) {
    found.qty += 1;
  } else {
    cart.push({ id: p.id, maker: p.maker, name: p.name, price: p.price, qty: 1 });
  }
  renderCart();
}

function changeQty(id, delta) {
  playTone('tap');
  const found = cart.find(item => item.id === id);
  if (!found) return;
  found.qty += delta;
  if (found.qty <= 0) {
    cart = cart.filter(item => item.id !== id);
  }
  renderCart();
}

function removeItem(id) {
  playTone('tap');
  cart = cart.filter(item => item.id !== id);
  renderCart();
}

function setDiscount(rate) {
  playTone('tap');
  discountRate = rate;
  [0, 5, 10, 20].forEach(r => {
    document.getElementById('d' + r).className = 'disc-btn' + (r === rate ? ' active' : '');
  });
  updateSummary();
}

function getFinalTotal() {
  const sub = cart.reduce((acc, item) => acc + item.price * item.qty, 0);
  return Math.floor(sub * (100 - discountRate) / 100);
}

function renderCart() {
  const list = document.getElementById('cartList');
  list.innerHTML = '';
  const count = cart.reduce((acc, item) => acc + item.qty, 0);
  document.getElementById('itemCount').textContent = count + '点';

  if (cart.length === 0) {
    const li = document.createElement('li');
    li.className = 'cart-empty';
    li.textContent = '左の商品をタップして追加してください';
    list.appendChild(li);
    updateSummary();
    return;
  }

  cart.forEach(item => {
    const li = document.createElement('li');
    li.className = 'cart-item';

    const info = document.createElement('div');
    info.className = 'ci-info';
    const nDiv = document.createElement('div');
    nDiv.className = 'ci-name';
    nDiv.textContent = '[' + item.maker + '] ' + item.name;
    const sDiv = document.createElement('div');
    sDiv.className = 'ci-sub';
    sDiv.textContent = item.price.toLocaleString() + '円 × ' + item.qty + ' ＝ ' + (item.price * item.qty).toLocaleString() + '円';
    info.appendChild(nDiv);
    info.appendChild(sDiv);

    const ctrl = document.createElement('div');
    ctrl.className = 'ci-ctrl';
    const bMinus = document.createElement('button');
    bMinus.className = 'qty-btn';
    bMinus.textContent = '−';
    bMinus.onclick = () => changeQty(item.id, -1);

    const qSpan = document.createElement('span');
    qSpan.style.fontWeight = 'bold';
    qSpan.style.minWidth = '18px';
    qSpan.style.textAlign = 'center';
    qSpan.textContent = item.qty;

    const bPlus = document.createElement('button');
    bPlus.className = 'qty-btn';
    bPlus.textContent = '＋';
    bPlus.onclick = () => changeQty(item.id, 1);

    const bDel = document.createElement('button');
    bDel.className = 'del-btn';
    bDel.textContent = '削除';
    bDel.onclick = () => removeItem(item.id);

    ctrl.appendChild(bMinus);
    ctrl.appendChild(qSpan);
    ctrl.appendChild(bPlus);
    ctrl.appendChild(bDel);

    li.appendChild(info);
    li.appendChild(ctrl);
    list.appendChild(li);
  });

  updateSummary();
}

function updateSummary() {
  const total = getFinalTotal();
  const pts = Math.floor(total * 0.01);
  document.getElementById('totalDisplay').textContent = total.toLocaleString() + ' 円';
  document.getElementById('pointBadge').textContent = '+' + pts.toLocaleString() + ' pt 還元';

  const dep = parseInt(document.getElementById('depositInput').value, 10);
  const chEl = document.getElementById('changeDisplay');
  if (isNaN(dep)) {
    chEl.textContent = '0 円';
    chEl.style.color = '#059669';
    return;
  }
  const diff = dep - total;
  if (diff >= 0) {
    chEl.textContent = diff.toLocaleString() + ' 円';
    chEl.style.color = '#059669';
  } else {
    chEl.textContent = '不足 ' + Math.abs(diff).toLocaleString() + ' 円';
    chEl.style.color = '#dc2626';
  }
}

function setExactCash() {
  playTone('tap');
  document.getElementById('depositInput').value = getFinalTotal();
  updateSummary();
}

function addCash(amount) {
  playTone('tap');
  const cur = parseInt(document.getElementById('depositInput').value, 10) || 0;
  document.getElementById('depositInput').value = cur + amount;
  updateSummary();
}

function clearCash() {
  playTone('tap');
  document.getElementById('depositInput').value = '';
  updateSummary();
}

function clearCart() {
  playTone('tap');
  cart = [];
  discountRate = 0;
  [0, 5, 10, 20].forEach(r => {
    document.getElementById('d' + r).className = 'disc-btn' + (r === 0 ? ' active' : '');
  });
  document.getElementById('depositInput').value = '';
  renderCart();
}

function completeCheckout() {
  const total = getFinalTotal();
  if (total === 0 && cart.length === 0) {
    alert('商品が選択されていません');
    return;
  }
  const dep = parseInt(document.getElementById('depositInput').value, 10);
  if (!isNaN(dep) && dep < total) {
    alert('お預かり金額が不足しています');
    return;
  }
  playTone('cash');
  sales.total += total;
  sales.count += 1;
  try { localStorage.setItem('joshin_sales_v9', JSON.stringify(sales)); } catch (e) {}
  updateSalesView();
  const change = isNaN(dep) ? 0 : (dep - total);
  const pts = Math.floor(total * 0.01);
  alert('ありがとうございました！\n\nお買上合計: ' + total.toLocaleString() + '円\nお釣り: ' + change.toLocaleString() + '円\n獲得ポイント: +' + pts.toLocaleString() + 'pt');
  clearCart();
}

function updateSalesView() {
  document.getElementById('salesTotal').textContent = sales.total.toLocaleString();
  document.getElementById('salesCount').textContent = sales.count;
}

function resetSales() {
  if (!confirm('本日の売上集計を0円にリセットしますか？')) return;
  sales = { total: 0, count: 0 };
  try { localStorage.setItem('joshin_sales_v9', JSON.stringify(sales)); } catch (e) {}
  updateSalesView();
}

renderTabs();
renderProducts();
renderCart();
updateSalesView();
</script>
</body>
</html>
